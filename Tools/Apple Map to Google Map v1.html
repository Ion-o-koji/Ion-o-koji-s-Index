<!DOCTYPE html>
<!-- By Ion-o-koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Map to Google Map v1</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #f2f2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #1c1c1e;
    }

    p {
      color: #8e8e93;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 1rem;
      border: 1px solid #d1d1d6;
      border-radius: 12px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }

    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    button:disabled {
      background: #aeaeb2;
    }

    #loader {
      display: none;
      margin: 20px auto;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #007aff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    #result {
      margin-top: 1.5rem;
      display: none;
      padding: 1.2rem;
      background: #f2f2f7;
      border-radius: 12px;
      word-break: break-all;
    }

    .google-link {
      display: block;
      margin-top: 10px;
      color: #007aff;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.1rem;
    }

  </style>
</head>

<body>
  <div class="card">
    <h1>Maps Converter</h1>
    <p>Paste an Apple Maps link below</p>
    <input type="text" id="appleLink" placeholder="https://maps.apple/p/..." autocomplete="off">
    <button id="btn" onclick="convertLink()">Convert to Google Maps</button>
    <div id="loader"></div>
    <div id="result">
      <span style="color: #1c1c1e; font-weight: 500;">Location Found:</span>
      <a id="googleUrl" class="google-link" target="_blank" href="#">Open in Google Maps</a>
    </div>
  </div>
  <script>
    async function convertLink() {
      var input = document.getElementById('appleLink').value.trim();
      var btn = document.getElementById('btn');
      var loader = document.getElementById('loader');
      var resultDiv = document.getElementById('result');
      var googleUrlAnchor = document.getElementById('googleUrl');
      if (!input) return;
      resultDiv.style.display = "none";
      btn.disabled = true;
      loader.style.display = "block";
      try {
        var coords = "";
        if (input.indexOf("maps.apple") !== -1) {
          var proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(input);
          var response = await fetch(proxyUrl);
          var data = await response.json();
          var html = data.contents;
          var llMatch = html.match(/ll=([0-9.-]+)(?:,|%2C)([0-9.-]+)/) ||
            html.match(/q=([0-9.-]+)(?:,|%2C)([0-9.-]+)/) ||
            html.match(/center=([0-9.-]+)(?:,|%2C)([0-9.-]+)/);
          if (llMatch) {
            coords = llMatch[1] + "," + llMatch[2];
          }
        } else {
          var reg = /(-?\d+\.\d+),\s*(-?\d+\.\d+)/;
          var match = input.match(reg);
          if (match) {
            coords = match[1] + "," + match[2];
          }
        }
        if (coords) {
          googleUrlAnchor.href = "https://www.google.com/maps/search/?api=1&query=" + coords;
          googleUrlAnchor.textContent = "Click to Open in Google Maps";
          resultDiv.style.display = "block";
        } else {
          alert("Could not find coordinates. Try opening the link in a browser first, then copy the long URL here.");
        }
      } catch (error) {
        alert("Error connecting to the proxy. Check your internet connection.");
      } finally {
        btn.disabled = false;
        loader.style.display = "none";
      }
    }
    document.getElementById("appleLink").addEventListener("keyup", function(event) {
      if (event.key === "Enter") {
        convertLink();
      }
    });

    (() => {
      const ENTRY = 'Apple Map to Google Map v1',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>

</html>

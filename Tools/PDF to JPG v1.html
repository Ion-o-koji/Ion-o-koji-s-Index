<!DOCTYPE html>
<!-- By Ion-o-koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to JPG v1</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #0f1419, #1a1f2e);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #1a1f2e;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 500px;
      width: 90%;
      border: 1px solid #2a3f5f;
    }

    h1 {
      font-size: 3em;
      background: linear-gradient(90deg, #00d4ff, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #a0a0a0;
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    input[type="file"] {
      padding: 12px 20px;
      border-radius: 10px;
      border: 2px solid #00d4ff;
      cursor: pointer;
      margin-bottom: 20px;
      background: #0f1419;
      color: #a0a0a0;
    }

    button {
      background: linear-gradient(90deg, #00d4ff, #00ffff);
      color: #0f1419;
      padding: 12px 25px;
      border: none;
      border-radius: 12px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
      font-weight: 600;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    canvas {
      margin-top: 20px;
      border-radius: 12px;
      max-width: 100%;
      border: 1px solid #00d4ff;
      background: #0f1419;
    }

  </style>
</head>

<body>
  <div class="container">
    <h1>PDF to JPG v1</h1>
    <p class="subtitle">Upload your PDF to convert the first page into JPG</p>
    <input type="file" id="upload" accept="application/pdf">
    <br>
    <button id="downloadBtn" style="display:none;">Download JPG</button>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const input = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    function toast(message, type = 'success') {
      const toastEl = document.createElement('div');
      toastEl.style.cssText = `
                position: fixed;
                bottom: 30px;
                right: 30px;
                padding: 15px 25px;
                border-radius: 8px;
                font-weight: 600;
                animation: slideIn 0.3s ease;
                z-index: 1000;
                ${type === 'success' ? 'background: linear-gradient(135deg, #00d4ff 0%, #00ffff 100%); color: #0f1419;' : 'background: linear-gradient(135deg, #ff006e 0%, #ff3b3b 100%); color: white;'}
            `;
      toastEl.textContent = message;
      document.body.appendChild(toastEl);
      setTimeout(() => toastEl.remove(), 3000);
    }

    input.addEventListener('change', function(e) {
      const file = e.target.files[0];
      const reader = new FileReader();

      reader.onload = function() {
        const typedarray = new Uint8Array(this.result);
        pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
          pdf.getPage(1).then(function(page) {
            const viewport = page.getViewport({
              scale: 2
            });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            page.render({
              canvasContext: ctx,
              viewport: viewport
            }).promise.then(() => {
              downloadBtn.style.display = 'inline-block';
            });
          });
        });
      };
      reader.readAsArrayBuffer(file);
    });

    downloadBtn.addEventListener('click', async function() {
      const link = document.createElement('a');
      link.download = 'page1.jpg';

      canvas.toBlob(async function(blob) {
        await exportFile(blob, 'page1.jpg');
      }, 'image/jpeg', 0.95);
    });

    async function exportFile(blob, filename = "page1.jpg") {
      if (!filename.endsWith(".jpg")) {
        filename += ".jpg";
      }

      // Try File System Access API first
      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{
              description: "JPEG Images",
              accept: {
                "image/jpeg": [".jpg"]
              }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          console.log("File saved using File System Access API.");
          toast('File saved', 'success');
          return;
        } catch (err) {
          console.warn("File System Access API failed:", err);
          toast('File System Access API failed', 'error');
        }
      }

      // Fallback: Regular download
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        console.log("File saved via regular download fallback.");
        toast('File saved', 'success');
      } catch (err) {
        console.warn("Regular download fallback failed:", err);
        toast('Download failed', 'error');
      }
    }

    (() => {
      const ENTRY = 'PDF to JPG v1',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>

</html>

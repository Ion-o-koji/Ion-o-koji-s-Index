<!DOCTYPE html>
<!-- By Ion-o-koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Generator v3</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 20px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    input,
    select {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a22;
      color: #eee;
      font-size: 16px;
      outline: none;
      flex: 1;
    }

    button {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background: #8b5cf6;
    }

    #result {
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      background: #1a1a22;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-direction: column;
      gap: 10px;
    }

    #result img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #error {
      color: #f87171;
      font-size: 14px;
      text-align: center;
      padding: 0 20px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top: 4px solid #7c3aed;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

  </style>
</head>

<body>

  <h1>AI Image Generator</h1>

  <div class="card">
    <input id="prompt" type="text" placeholder="A Cambodian that is obsessed with America..." />
    <div class="row">
      <select id="model">
        <option value="flux">Flux - Best Quality</option>
        <option value="sdxl">SDXL - Balanced</option>
        <option value="turbo">Turbo - Fastest</option>
      </select>
      <button id="generate">Generate</button>
    </div>
  </div>

  <div id="result">
    <div class="spinner hidden" id="spinner"></div>
    <span id="placeholder">Your image will appear here</span>
    <div id="error" class="hidden"></div>
  </div>

  <script>
    const client = {
      base: 'https://image.pollinations.ai/prompt/',
      imageUrl(prompt, options = {}) {
        const params = new URLSearchParams({
          width: options.width || 1024,
          height: options.height || 1024,
          seed: options.seed || Math.floor(Math.random() * 1000000),
          model: options.model || 'flux',
          enhance: options.enhance ?? true,
          nologo: options.nologo ?? true
        });
        return `${this.base}${encodeURIComponent(prompt)}?${params.toString()}`;
      }
    };

    const promptEl = document.getElementById('prompt');
    const modelEl = document.getElementById('model');
    const btn = document.getElementById('generate');
    const result = document.getElementById('result');
    const spinner = document.getElementById('spinner');
    const placeholder = document.getElementById('placeholder');
    const errorEl = document.getElementById('error');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
      placeholder.classList.remove('hidden');
    }

    function clearError() {
      errorEl.classList.add('hidden');
      errorEl.textContent = '';
    }

    async function generateImage() {
      const prompt = promptEl.value.trim();
      if (!prompt) return showError('Type a prompt first');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      placeholder.classList.add('hidden');
      clearError();
      result.querySelector('img')?.remove();

      try {
        const url = client.imageUrl(prompt, {
          model: modelEl.value
        });
        const res = await fetch(url);

        // Handle rejections
        if (!res.ok) {
          if (res.status === 429) throw new Error('Rate limited. Wait 10s and try again.');
          if (res.status === 400) throw new Error('Prompt blocked. Try rewording it.');
          throw new Error(`Server error: ${res.status} ${res.statusText}`);
        }

        const blob = await res.blob();
        if (blob.type !== 'image/jpeg' && blob.type !== 'image/png') {
          throw new Error('Got invalid response from server');
        }

        const imgUrl = URL.createObjectURL(blob);
        const img = document.createElement('img');
        img.src = imgUrl;
        result.appendChild(img);

      } catch (e) {
        console.error(e);
        showError(e.message);
      } finally {
        spinner.classList.add('hidden');
        btn.disabled = false;
      }
    }

    btn.onclick = generateImage;
    promptEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') generateImage();
    });

    (() => {
      const ENTRY = 'AI Image Generator v3',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>

</body>

</html>

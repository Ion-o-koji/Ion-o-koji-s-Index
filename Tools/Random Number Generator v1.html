<!DOCTYPE html>
<!-- By Ion-o-koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number Generator v1</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
      padding: 20px;
    }

    .container {
      background-color: #16213e;
      padding: 40px 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 100%;
      max-width: 350px;
    }

    .title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 30px;
      color: #e94560;
    }

    #number-input {
      width: 80%;
      height: 40px;
      font-size: 20px;
      padding: 10px;
      margin-bottom: 30px;
      border: none;
      border-radius: 10px;
      background-color: #0f3460;
      color: #fff;
      outline: none;
    }

    #generate-btn {
      width: 80%;
      height: 50px;
      font-size: 20px;
      background-color: #e94560;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-bottom: 30px;
    }

    #generate-btn:hover {
      background-color: #ff6b81;
    }

    #result {
      font-size: 60px;
      font-weight: 600;
      color: #e94560;
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="title">Random Number</div>
    <input id="number-input" type="number" placeholder="Max">
    <button id="generate-btn">Generate</button>
    <div id="result"></div>
  </div>

  <script>
    const numberInput = document.getElementById('number-input');
    const generateBtn = document.getElementById('generate-btn');
    const resultDiv = document.getElementById('result');

    generateBtn.addEventListener('click', () => {
      const maxNumber = parseInt(numberInput.value);
      if (isNaN(maxNumber) || maxNumber < 1) {
        resultDiv.textContent = 'Invalid';
        return;
      }
      const randomNumber = Math.floor(Math.random() * maxNumber) + 1;
      resultDiv.textContent = randomNumber;
    });

    (() => {
      const ENTRY = 'Random Number Generator v1',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>

</html>

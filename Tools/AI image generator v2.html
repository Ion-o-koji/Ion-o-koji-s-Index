<!DOCTYPE html>
<!-- By Ion-o-koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI image generator v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

    :root {
      --bg-deep: #0a0a0c;
      --surface: #121214;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-dim: #94a3b8;
    }

    body {
      background-color: var(--bg-deep);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
    }

    .glow-btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 0 20px var(--accent-glow);
      transition: all 0.3s ease;
    }

    .glow-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 35px var(--accent-glow);
    }

    .glow-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    .gradient-text {
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #6366f1;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .gallery-item {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .error-toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 100;
      transform: translateY(150%);
      transition: transform 0.3s ease;
    }

    .error-toast.show {
      transform: translateY(0);
    }

  </style>
</head>

<body>

  <nav class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center glass mt-4 mx-auto max-w-7xl left-0 right-0">
    <div class="text-xs font-bold text-indigo-400 tracking-widest uppercase">
      Images Generated by Pollinations.ai
    </div>
  </nav>

  <section class="relative pt-48 pb-24 px-6 max-w-7xl mx-auto text-center">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full -z-10 pointer-events-none">
      <div class="absolute top-20 left-1/4 w-96 h-96 bg-indigo-600/20 blur-[120px] rounded-full"></div>
      <div class="absolute top-40 right-1/4 w-80 h-80 bg-purple-600/10 blur-[120px] rounded-full"></div>
    </div>

    <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight tracking-tighter">
      AI Image Generator
    </h1>

    <div class="max-w-3xl mx-auto glass p-2 flex items-center gap-2 shadow-2xl relative">
      <input type="text" id="promptInput" placeholder="Describe the image you want generated..." class="bg-transparent border-none outline-none flex-grow px-6 py-3 text-white placeholder-slate-500">
      <button id="generateBtn" class="glow-btn px-8 py-3 rounded-xl font-bold flex items-center gap-3">
        <span id="btnText">Generate</span>
        <div id="loadingSpinner" class="spinner hidden"></div>
      </button>
    </div>
  </section>

  <section id="resultSection" class="max-w-4xl mx-auto px-6 mb-20 hidden">
    <div class="glass p-4 relative group">
      <img id="resultImage" src="" alt="Generated AI Art" class="w-full rounded-2xl border border-white/10 shadow-2xl">
      <div class="mt-4 flex justify-between items-center px-2">
        <p id="resultPrompt" class="text-sm italic text-slate-400 truncate max-w-md"></p>
        <div class="flex gap-4">

        </div>
      </div>
    </div>
  </section>

  <div id="errorToast" class="error-toast glass px-6 py-4 bg-red-900/20 border-red-500/50 flex items-center gap-4 text-red-200">
    <i class="fas fa-exclamation-circle"></i>
    <span id="errorMessage">Something went wrong. Wait wait a minute it may be trying to generate a previous request.</span>
  </div>

  <script>
    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const btnText = document.getElementById('btnText');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const resultSection = document.getElementById('resultSection');
    const resultImage = document.getElementById('resultImage');
    const resultPrompt = document.getElementById('resultPrompt');
    const galleryGrid = document.getElementById('galleryGrid');
    const errorToast = document.getElementById('errorToast');
    const errorMessage = document.getElementById('errorMessage');

    let isGenerating = false;

    async function generateImage() {
      const prompt = promptInput.value.trim();
      if (!prompt || isGenerating) return;

      setLoading(true);
      hideError();

      try {
        // Pollinations usage is URL-based. We construct the URL with parameters.
        const seed = Math.floor(Math.random() * 9999999);
        const width = 1024;
        const height = 1024;
        const model = 'flux'; // Pollinations high quality model
        const nologo = 'true';

        const encodedPrompt = encodeURIComponent(prompt);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&model=${model}&nologo=${nologo}`;

        // Pre-load the image to ensure it's ready before showing
        await preloadImage(imageUrl);

        displayResult(imageUrl, prompt);
        addToGallery(imageUrl, prompt);
      } catch (err) {} finally {
        setLoading(false);
      }
    }

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => reject(new Error("Image failed to load"));
        img.src = url;
      });
    }

    function setLoading(state) {
      isGenerating = state;
      generateBtn.disabled = state;
      promptInput.disabled = state;
      btnText.textContent = state ? 'Pollinating...' : 'Generate';
      loadingSpinner.classList.toggle('hidden', !state);
    }

    function displayResult(url, prompt) {
      resultImage.src = url;
      resultPrompt.textContent = `"${prompt}"`;
      resultSection.classList.remove('hidden');
      resultSection.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }

    function addToGallery(url, prompt) {
      if (galleryGrid.querySelector('.opacity-40')) {
        galleryGrid.innerHTML = '';
      }

      const item = document.createElement('div');
      item.className = 'gallery-item relative rounded-3xl overflow-hidden group cursor-pointer aspect-square bg-slate-800 border border-white/5 shadow-xl';
      item.innerHTML = `
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity z-10 p-6 flex flex-col justify-end">
                    <p class="text-xs italic mb-2 line-clamp-2">"${prompt}"</p>
                    <div class="flex justify-between items-center">
                         <span class="text-[10px] text-slate-400">Flux Model</span>
                         <i class="fas fa-expand text-indigo-400"></i>
                    </div>
                </div>
                <img src="${url}" alt="${prompt}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
            `;

      item.onclick = () => {
        displayResult(url, prompt);
      };

      galleryGrid.prepend(item);
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorToast.classList.add('show');
      setTimeout(hideError, 5000);
    }

    function hideError() {
      errorToast.classList.remove('show');
    }

    async function downloadImage() {
      const response = await fetch(resultImage.src);
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Aura-Pollination-${Date.now()}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.URL.revokeObjectURL(url);
    }

    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
      promptInput.focus();
    }

    generateBtn.addEventListener('click', generateImage);
    promptInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateImage();
    });

    window.addEventListener('scroll', () => {
      const nav = document.querySelector('nav');
      if (window.scrollY > 50) {
        nav.style.marginTop = '0';
        nav.style.borderRadius = '0';
        nav.style.maxWidth = '100%';
      } else {
        nav.style.marginTop = '1rem';
        nav.style.borderRadius = '24px';
        nav.style.maxWidth = '80rem';
      }
    });

    (() => {
      const ENTRY = 'AI image generator v2',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>

</html>

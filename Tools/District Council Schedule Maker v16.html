<!DOCTYPE html>
<!-- By Ion-o-koji (Porter Olsen) -->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>District Council Schedule Maker v16</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --card: #ffffff;
      --accent: #2b6cb0;
      --muted: #666;
      --pad: 12px;
      --radius: 6px;
      --base-font: 16px;
      --thick-border: 2px;
      --border-color: #000;
      --table-outline: #000;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: #111;
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: var(--base-font);
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }

    .app {
      min-height: 100%;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 10px 12px 16px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #siteName {
      font-size: 1.25rem;
      font-weight: 800;
      padding: 2px 4px;
      border-radius: 4px;
      background: transparent;
      line-height: 1.2;
      min-width: 60px;
    }

    .nearest-tuesday {
      font-size: 0.72rem;
      color: var(--muted);
      padding-left: 4px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      background: var(--accent);
      color: white;
      border: 0;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    button.ghost {
      background: transparent;
      border: 1px solid #d0d7de;
      color: var(--muted);
    }

    main {
      flex: 1 1 auto;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .center-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
      padding: 6px 16px 16px;
      box-sizing: border-box;
    }

    .big-btn {
      width: 100%;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      border-radius: 12px;
      background: linear-gradient(145deg, #ffffff, #f0f6ff);
      border: 1.5px solid #d0e4fa;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(43, 108, 176, 0.07);
      padding: 14px;
      font-weight: 800;
      color: #1a3a5c;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 0.15s;
    }

    .big-btn:active {
      box-shadow: 0 1px 3px rgba(43, 108, 176, 0.12);
    }

    .inner {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow: hidden;
    }

    table.grid {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      border: var(--thick-border) solid var(--table-outline);
      font-size: 0.95rem;
    }

    table.grid td,
    table.grid th {
      border: var(--thick-border) solid var(--border-color);
      padding: 5px;
      vertical-align: middle;
      background: white;
      word-break: break-word;
      text-align: center;
    }

    table.grid th {
      font-weight: 800;
      background: #f1f7ff;
    }

    .schedule-grid td,
    .schedule-grid th {
      text-align: left;
      vertical-align: top;
    }

    .cell {
      width: 100%;
      height: 100%;
      min-height: 36px;
      font-size: 0.95rem;
      box-sizing: border-box;
      white-space: pre-wrap;
      padding: 5px;
    }

    .cell[contenteditable="true"] {
      outline: none;
    }

    .key-grid td {
      height: 60px;
      max-height: 60px;
      padding: 3px;
      font-size: 0.88rem;
    }

    .media-grid td {
      height: 52px;
      max-height: 52px;
      padding: 3px;
      font-size: 0.88rem;
    }

    .key-grid td .cell,
    .media-grid td .cell {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
      padding: 5px;
      height: 100%;
      box-sizing: border-box;
    }

    .section-divider {
      border-bottom: 1px solid #000;
      margin: 12px 0;
    }

    .goals-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .goal-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 9px 10px;
      border-radius: 8px;
      background: #f8fbff;
      border: 1.5px solid #cbd5e0;
      cursor: move;
      user-select: none;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .goal-item.dragging-item {
      opacity: 0.5;
    }

    .goal-item.drag-over {
      border-top: 3px solid #2b6cb0;
    }

    .goal-item.is-checked {
      background: #f0fdf4;
      border-color: #a7f3d0;
    }

    .goal-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #fff;
      border: 2px solid #718096;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .goal-mark.checked {
      background: #38a169;
      color: white;
      border-color: transparent;
    }

    .goal-text,
    .task-text {
      flex: 1;
      min-width: 80px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .goal-text:empty::before,
    .task-text:empty::before,
    .goal-details li:empty::before {
      content: attr(data-placeholder);
      color: #aaa;
    }

    .goal-details {
      margin-top: 4px;
      background: #eef3ff;
      padding: 5px 8px;
      border-radius: 4px;
    }

    .goal-details ul {
      margin: 0;
      padding: 0 0 0 16px;
    }

    .goal-details li {
      margin: 2px 0;
      font-weight: normal;
      font-size: 0.85rem;
      min-height: 16px;
    }

    .goal-details li[contenteditable="true"] {
      padding: 2px 3px;
      background: white;
      border-radius: 3px;
      outline: 1px solid #ccc;
    }

    .goal-item-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .goal-item-footer {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .goal-item-footer-top {
      display: flex;
      gap: 5px;
    }

    .goal-item-footer-top button {
      padding: 3px 7px;
      font-size: 0.75rem;
    }

    .goal-item-footer-bottom {
      display: flex;
    }

    .goal-item-footer-bottom button {
      padding: 5px 9px;
      font-size: 0.8rem;
    }

    .district-input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .district-input-wrapper label {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .district-input-wrapper input {
      padding: 7px 10px;
      border: 2px solid #718096;
      border-radius: 6px;
      font-size: 0.95rem;
      flex: 1;
    }

    .hidden {
      display: none !important;
    }

    footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.85rem;
      padding-top: 4px;
    }

    #exportModal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      background: rgba(6, 6, 6, 0.5);
      z-index: 9999;
      padding: 10px;
      box-sizing: border-box;
    }

    .modal-inner {
      width: 100%;
      max-width: 900px;
      background: white;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(10, 10, 10, 0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-inner .modal-title {
      font-weight: 900;
      font-size: 1rem;
    }

    .export-preview-frame {
      flex: 1;
      width: 100%;
      min-height: 300px;
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      background: #fafafa;
    }

    input[type=file] {
      display: none;
    }

    .media-controls {
      display: flex;
      gap: 6px;
    }

    .goals-section-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .goals-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      flex-shrink: 0;
    }

    .goals-section-header div:first-child {
      font-weight: 800;
      font-size: 1rem;
    }

    .goals-list-container {
      flex: 1;
      overflow: auto;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      padding: 10px;
      background: #f7fafc;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .goals-tasks-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .ki-media-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .ki-section-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .ki-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      flex-shrink: 0;
    }

    .ki-section-header div:first-child {
      font-weight: 800;
      font-size: 1rem;
    }

    .ki-table-container {
      flex: 1;
      overflow: auto;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      padding: 8px;
      background: #f7fafc;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #718096;
      padding: 4px 0 6px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 8px;
    }

    @media (min-width: 600px) {
      .center-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .big-btn {
        min-height: 100px;
      }
    }

  </style>
</head>

<body>
  <div class="app">
    <!-- Main Page -->
    <div class="page" id="mainPage">
      <header>
        <div class="title-wrap">
          <div id="siteName" contenteditable="true" aria-label="Site name">District Council</div>
          <div class="nearest-tuesday" id="headerDate"></div>
        </div>
        <div class="controls">
          <button id="importLastBtn" class="secondary">Import Last</button>
          <button id="importBtn" class="secondary">Import</button>
          <input id="fileImport" type="file" accept=".html,text/html">
          <button id="exportBtn">Export</button>
          <button class="secondary" id="resetBtn">Reset</button>
        </div>
      </header>
      <main>
        <div class="center-grid" role="navigation" aria-label="Main navigation">
          <div class="big-btn" data-target="schedulePage" style="font-size:0.85rem;">📅 Schedule</div>
          <div class="big-btn" data-target="keyIndicatorsPage">📊 Key Indicators &amp; Media</div>
          <div class="big-btn" data-target="goalsPage">🎯 Goals &amp; Tasks</div>
        </div>
      </main>
    </div>

    <!-- Schedule Page -->
    <div class="page hidden" id="schedulePage">
      <header>
        <div class="title-wrap">
          <div style="font-weight:800;font-size:1.1rem;">Schedule</div>
        </div>
        <div class="controls">
          <button id="addScheduleRow" class="secondary">+ Row</button>
          <button id="removeScheduleRow" class="secondary">− Row</button>
          <button class="ghost" data-action="back">← Back</button>
        </div>
      </header>
      <main>
        <div class="inner">
          <div class="district-input-wrapper">
            <label for="districtInput">District:</label>
            <input type="text" id="districtInput" placeholder="Enter district name">
          </div>
          <table class="grid schedule-grid" id="scheduleTable" aria-label="Schedule grid">
            <tbody>
              <tr>
                <td>
                  <div class="cell" contenteditable="true" data-pos="1-1"></div>
                </td>
                <td>
                  <div class="cell" contenteditable="true" data-pos="1-2"></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="cell" contenteditable="true" data-pos="2-1"></div>
                </td>
                <td>
                  <div class="cell" contenteditable="true" data-pos="2-2"></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="cell" contenteditable="true" data-pos="3-1"></div>
                </td>
                <td>
                  <div class="cell" contenteditable="true" data-pos="3-2"></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="cell" contenteditable="true" data-pos="4-1"></div>
                </td>
                <td>
                  <div class="cell" contenteditable="true" data-pos="4-2"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Key Indicators Page -->
    <div class="page hidden" id="keyIndicatorsPage">
      <header>
        <div class="title-wrap">
          <div style="font-weight:800;font-size:1.1rem;">Key Indicators &amp; Media</div>
        </div>
        <div class="controls">
          <button class="ghost" data-action="back">← Back</button>
        </div>
      </header>
      <main>
        <div class="inner">
          <div class="ki-media-container">
            <div class="ki-section-wrapper">
              <div class="ki-section-header">
                <div>Key Indicators</div>
                <div class="media-controls">
                  <button id="addKIrow" class="secondary">+ Row</button>
                  <button id="removeKIrow" class="secondary">− Row</button>
                </div>
              </div>
              <div class="ki-table-container">
                <table class="grid key-grid" id="keyGrid" aria-label="Key indicators grid">
                  <tbody>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-4"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-5"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-6"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-1-7"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-4"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-5"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-6"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-2-7"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-4"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-5"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-6"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-3-7"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-4"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-5"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-6"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="KI-4-7"></div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="ki-section-wrapper">
              <div class="ki-section-header">
                <div>Media Referrals</div>
                <div class="media-controls">
                  <button id="addMediaRow" class="secondary">+ Row</button>
                  <button id="removeMediaRow" class="secondary">− Row</button>
                </div>
              </div>
              <div class="ki-table-container">
                <table class="grid media-grid" id="mediaGrid" aria-label="Media referrals grid">
                  <tbody>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-1-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-1-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-1-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-1-4"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-2-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-2-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-2-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-2-4"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-3-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-3-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-3-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-3-4"></div>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-4-1"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-4-2"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-4-3"></div>
                      </td>
                      <td>
                        <div class="cell" contenteditable="true" data-pos="M-4-4"></div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Goals & Tasks Page -->
    <div class="page hidden" id="goalsPage">
      <header>
        <div class="title-wrap">
          <div style="font-weight:800;font-size:1.1rem;">Goals &amp; Tasks</div>
        </div>
        <div class="controls">
          <button class="ghost" data-action="back">← Back</button>
        </div>
      </header>
      <main>
        <div class="inner">
          <div class="goals-tasks-container">
            <div class="goals-section-wrapper">
              <div class="goals-section-header">
                <div>Goals</div>
                <button id="addGoalBtn" class="secondary">+ Add Goal</button>
              </div>
              <div class="goals-list-container">
                <div class="goals-list" id="goalsList"></div>
              </div>
            </div>
            <div class="goals-section-wrapper">
              <div class="goals-section-header">
                <div>Tasks</div>
                <button id="addTaskBtn" class="secondary">+ Add Task</button>
              </div>
              <div class="goals-list-container">
                <div class="goals-list" id="tasksList"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Export Modal -->
  <div id="exportModal" class="hidden" aria-hidden="true">
    <div class="modal-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="modal-title">Export Preview</div>
        <button id="closeExport" class="ghost">Close</button>
      </div>
      <iframe id="exportPreviewFrame" class="export-preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>

  <script>
    // ─── Nearest Tuesday ─────────────────────────────────────────────────────
    function getNearestTuesday() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const day = today.getDay(); // 0=Sun,1=Mon,2=Tue,...
      const prevDiff = (day - 2 + 7) % 7; // days since last Tuesday
      const nextDiff = (2 - day + 7) % 7; // days until next Tuesday
      const offset = (prevDiff === 0) ? 0 : (prevDiff <= nextDiff ? -prevDiff : nextDiff);
      const d = new Date(today);
      d.setDate(today.getDate() + offset);
      return d;
    }

    function formatDate(d) {
      return d.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function getDateStamp(d) {
      d = d || getNearestTuesday();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const year = String(d.getFullYear()).slice(-2);
      return `${month}_${day}_${year}`;
    }

    // Show nearest Tuesday in header
    document.getElementById('headerDate').textContent = 'Week of ' + formatDate(getNearestTuesday());

    // ─── Prevent pull-to-refresh & Android back ───────────────────────────────
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1 && document.scrollingElement && document.scrollingElement.scrollTop === 0) {
        // suppress pull-to-refresh gesture at top
      }
    }, {
      passive: false
    });

    // Push multiple history states so back button doesn't close the tab
    (function preventBackClose() {
      history.pushState({
        page: 1
      }, '', location.href);
      history.pushState({
        page: 2
      }, '', location.href);
      window.addEventListener('popstate', function(e) {
        history.pushState({
          page: 2
        }, '', location.href);
      });
    })();

    // ─── Page navigation ──────────────────────────────────────────────────────
    const pages = {
      mainPage: document.getElementById('mainPage'),
      schedulePage: document.getElementById('schedulePage'),
      keyIndicatorsPage: document.getElementById('keyIndicatorsPage'),
      goalsPage: document.getElementById('goalsPage')
    };

    function showPage(id) {
      Object.values(pages).forEach(p => p.classList.add('hidden'));
      const el = document.getElementById(id);
      if (el) el.classList.remove('hidden');
      hideExportModal();
      window.scrollTo(0, 0);
    }

    document.querySelectorAll('.big-btn').forEach(btn => btn.addEventListener('click', () => showPage(btn.dataset.target)));
    document.querySelectorAll('[data-action="back"]').forEach(b => b.addEventListener('click', () => showPage('mainPage')));

    // ─── Schedule table ───────────────────────────────────────────────────────
    const scheduleTable = document.getElementById('scheduleTable');
    document.getElementById('addScheduleRow').addEventListener('click', () => {
      const tbody = scheduleTable.tBodies[0];
      const i = tbody.querySelectorAll('tr').length + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><div class="cell" contenteditable="true" data-pos="${i}-1"></div></td><td><div class="cell" contenteditable="true" data-pos="${i}-2"></div></td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('removeScheduleRow').addEventListener('click', () => {
      const tbody = scheduleTable.tBodies[0];
      const rows = tbody.querySelectorAll('tr');
      if (rows.length > 1) rows[rows.length - 1].remove();
      else alert('Cannot remove the last row');
    });

    // ─── Key Indicators table ─────────────────────────────────────────────────
    const keyGrid = document.getElementById('keyGrid');
    document.getElementById('addKIrow').addEventListener('click', () => {
      const tbody = keyGrid.tBodies[0];
      const i = tbody.querySelectorAll('tr').length + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = Array.from({
        length: 7
      }, (_, c) => `<td><div class="cell" contenteditable="true" data-pos="KI-${i}-${c+1}"></div></td>`).join('');
      tbody.appendChild(tr);
    });

    document.getElementById('removeKIrow').addEventListener('click', () => {
      const tbody = keyGrid.tBodies[0];
      const rows = tbody.querySelectorAll('tr');
      if (rows.length > 1) rows[rows.length - 1].remove();
      else alert('Cannot remove the last row');
    });

    // ─── Media Referrals table ────────────────────────────────────────────────
    const mediaGrid = document.getElementById('mediaGrid');
    document.getElementById('addMediaRow').addEventListener('click', () => {
      const tbody = mediaGrid.tBodies[0];
      const i = tbody.querySelectorAll('tr').length + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = Array.from({
        length: 4
      }, (_, c) => `<td><div class="cell" contenteditable="true" data-pos="M-${i}-${c+1}"></div></td>`).join('');
      tbody.appendChild(tr);
    });

    document.getElementById('removeMediaRow').addEventListener('click', () => {
      const tbody = mediaGrid.tBodies[0];
      const rows = tbody.querySelectorAll('tr');
      if (rows.length > 1) rows[rows.length - 1].remove();
      else alert('Cannot remove the last row');
    });

    // ─── Goals & Tasks ────────────────────────────────────────────────────────
    function attachGoalHandlers(wrapper, isTask) {
      const mark = wrapper.querySelector('.goal-mark');
      if (mark) {
        mark.onclick = (e) => {
          e.stopPropagation();
          toggleMark(mark, wrapper);
        };
        mark.onkeydown = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            e.stopPropagation();
            toggleMark(mark, wrapper);
          }
        };
      }

      const addNoteBtn = wrapper.querySelector('.small-add-note');
      if (addNoteBtn && !addNoteBtn._setup) {
        addNoteBtn._setup = true;
        addNoteBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const detailsEl = wrapper.querySelector('.goal-details');
          const ulEl = detailsEl.querySelector('ul');
          const newLi = document.createElement('li');
          newLi.contentEditable = 'true';
          newLi.setAttribute('data-placeholder', 'Optional note');
          ulEl.appendChild(newLi);
          detailsEl.classList.remove('hidden');
          attachRemoveNoteHandler(newLi);
          setTimeout(() => newLi.focus(), 50);
        };
      }

      const removeNoteBtn = wrapper.querySelector('.small-remove-note');
      if (removeNoteBtn && !removeNoteBtn._setup) {
        removeNoteBtn._setup = true;
        removeNoteBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const ulEl = wrapper.querySelector('.goal-details ul');
          const items = ulEl.querySelectorAll('li');
          if (items.length > 0) items[items.length - 1].remove();
          else alert('No notes to remove');
        };
      }

      const removeBtn = wrapper.querySelector('.small-remove');
      if (removeBtn && !removeBtn._setup) {
        removeBtn._setup = true;
        removeBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (confirm('Remove this item?')) wrapper.remove();
        };
      }

      wrapper.querySelectorAll('li').forEach(li => attachRemoveNoteHandler(li));

      wrapper.ondragstart = (e) => {
        e.dataTransfer.effectAllowed = 'move';
        wrapper.classList.add('dragging-item');
      };
      wrapper.ondragend = () => {
        wrapper.classList.remove('dragging-item');
        document.querySelectorAll('.goal-item').forEach(g => g.classList.remove('drag-over'));
      };
      wrapper.ondragover = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const list = wrapper.closest('.goals-list');
        if (list && list.querySelector('.dragging-item') !== wrapper) wrapper.classList.add('drag-over');
      };
      wrapper.ondragleave = () => wrapper.classList.remove('drag-over');
      wrapper.ondrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const list = wrapper.closest('.goals-list');
        const dragging = list ? list.querySelector('.dragging-item') : null;
        if (dragging && dragging !== wrapper) wrapper.parentNode.insertBefore(dragging, wrapper);
        wrapper.classList.remove('drag-over');
      };
    }

    function attachRemoveNoteHandler(li) {
      if (li._rmSetup) return;
      li._rmSetup = true;
      li.oncontextmenu = (e) => {
        e.preventDefault();
        if (confirm('Delete this note?')) li.remove();
      };
    }

    function toggleMark(markEl, wrapper) {
      const list = wrapper.closest('.goals-list');
      if (markEl.classList.contains('checked')) {
        // Unchecking → move to top of list
        markEl.classList.remove('checked');
        markEl.textContent = 'X';
        wrapper.classList.remove('is-checked');
        if (list) list.prepend(wrapper);
      } else {
        // Checking → move to top of checked group (first among checked at bottom)
        markEl.classList.add('checked');
        markEl.textContent = '✔';
        wrapper.classList.add('is-checked');
        if (list) {
          const firstChecked = Array.from(list.querySelectorAll('.goal-item.is-checked')).find(item => item !== wrapper);
          if (firstChecked) list.insertBefore(wrapper, firstChecked);
          else list.appendChild(wrapper);
        }
      }
    }

    function createGoalItem(text = '', mark = 'X', details = [], isTask = false) {
      const wrapper = document.createElement('div');
      wrapper.className = 'goal-item' + (mark === '✔' ? ' is-checked' : '');
      wrapper.dataset.id = (isTask ? 't-' : 'g-') + Date.now() + Math.random();
      wrapper.draggable = true;

      const textClass = isTask ? 'task-text' : 'goal-text';
      const placeholder = isTask ? 'New task — tap to edit' : 'New goal — tap to edit';

      const div = document.createElement('div');
      div.className = textClass;
      div.contentEditable = 'true';
      div.setAttribute('data-placeholder', placeholder);
      if (text) div.innerText = text;

      const content = document.createElement('div');
      content.className = 'goal-item-content';
      content.appendChild(div);

      const detailsDiv = document.createElement('div');
      detailsDiv.className = 'goal-details' + (details.length === 0 ? ' hidden' : '');
      const ul = document.createElement('ul');
      details.forEach(d => {
        const li = document.createElement('li');
        li.contentEditable = 'true';
        li.setAttribute('data-placeholder', 'Optional note');
        li.innerText = d;
        ul.appendChild(li);
      });
      detailsDiv.appendChild(ul);
      content.appendChild(detailsDiv);

      const footer = document.createElement('div');
      footer.className = 'goal-item-footer';

      const footerTop = document.createElement('div');
      footerTop.className = 'goal-item-footer-top';

      const addBtn = document.createElement('button');
      addBtn.className = 'small-add-note secondary';
      addBtn.innerText = 'Add note';
      footerTop.appendChild(addBtn);

      const removeNoteBtn = document.createElement('button');
      removeNoteBtn.className = 'small-remove-note secondary';
      removeNoteBtn.innerText = 'Remove note';
      footerTop.appendChild(removeNoteBtn);
      footer.appendChild(footerTop);

      const footerBottom = document.createElement('div');
      footerBottom.className = 'goal-item-footer-bottom';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'small-remove ghost';
      removeBtn.innerText = isTask ? 'Remove task' : 'Remove goal';
      footerBottom.appendChild(removeBtn);
      footer.appendChild(footerBottom);
      content.appendChild(footer);

      const markEl = document.createElement('div');
      markEl.className = 'goal-mark' + (mark === '✔' ? ' checked' : '');
      markEl.setAttribute('role', 'button');
      markEl.setAttribute('tabindex', '0');
      markEl.innerText = mark;

      wrapper.appendChild(markEl);
      wrapper.appendChild(content);
      attachGoalHandlers(wrapper, isTask);
      return wrapper;
    }

    // New items added to TOP of list
    document.getElementById('addGoalBtn').addEventListener('click', () => {
      const list = document.getElementById('goalsList');
      const newItem = createGoalItem('', 'X', [], false);
      list.prepend(newItem);
      newItem.querySelector('.goal-text').focus();
    });

    document.getElementById('addTaskBtn').addEventListener('click', () => {
      const list = document.getElementById('tasksList');
      const newItem = createGoalItem('', 'X', [], true);
      list.prepend(newItem);
      newItem.querySelector('.task-text').focus();
    });

    // ─── Reset ────────────────────────────────────────────────────────────────
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('Clear all data and start fresh?')) return;
      document.querySelectorAll('.cell').forEach(c => c.innerText = '');
      document.getElementById('districtInput').value = '';
      const goalsList = document.getElementById('goalsList');
      goalsList.innerHTML = '';
      goalsList.appendChild(createGoalItem('', 'X', [], false));
      const tasksList = document.getElementById('tasksList');
      tasksList.innerHTML = '';
      tasksList.appendChild(createGoalItem('', 'X', [], true));
    });

    // ─── Export ───────────────────────────────────────────────────────────────
    let _currentExportHtml = '';

    const exportBtn = document.getElementById('exportBtn');
    const exportModal = document.getElementById('exportModal');
    const closeExport = document.getElementById('closeExport');
    const downloadExport = document.getElementById('downloadExport');
    const exportFrame = document.getElementById('exportPreviewFrame');

    function hideExportModal() {
      exportModal.classList.add('hidden');
      exportModal.setAttribute('aria-hidden', 'true');
      // Clear iframe src to free memory
      exportFrame.srcdoc = '';
    }

    function showExportModal() {
      exportModal.classList.remove('hidden');
      exportModal.setAttribute('aria-hidden', 'false');
    }

    exportBtn.addEventListener('click', () => {
      _currentExportHtml = buildExportHtml();
      // Save to localStorage for "Import Last" feature
      try {
        localStorage.setItem('lastExportHtml', _currentExportHtml);
      } catch (e) {}
      exportFrame.srcdoc = _currentExportHtml;
      showExportModal();
    });

    closeExport.addEventListener('click', hideExportModal);

    exportModal.addEventListener('click', (e) => {
      if (e.target === exportModal) hideExportModal();
    });

    downloadExport.addEventListener('click', async (e) => {
      e.preventDefault();
      const content = _currentExportHtml || buildExportHtml();
      const districtName = (document.getElementById('districtInput').value || 'District').trim();
      const filename = `${districtName} District Council ${getDateStamp()}.html`;

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{
              description: 'HTML Files',
              accept: {
                'text/html': ['.html']
              }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(new Blob([content], {
            type: 'text/html'
          }));
          await writable.close();
          hideExportModal();
          return;
        } catch (err) {
          /* fall through */
        }
      }

      try {
        const blob = new Blob([content], {
          type: 'text/html'
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        hideExportModal();
        return;
      } catch (err) {
        /* fall through */
      }

      try {
        const file = new File([content], filename, {
          type: 'text/html'
        });
        if (navigator.canShare && navigator.canShare({
            files: [file]
          })) {
          await navigator.share({
            files: [file],
            title: filename
          });
          hideExportModal();
          return;
        }
      } catch (err) {
        /* fall through */
      }

      const w = window.open();
      if (w) {
        w.document.open();
        w.document.write(content);
        w.document.close();
        alert('Export opened in new tab — save from there.');
      } else {
        alert('Could not download. Try a different browser.');
      }
    });

    function escapeHtml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function buildExportHtml() {

      const css = `

      `.replace(/\s+/g, ' ').trim();

      function gatherTableRows(selector) {
        return Array.from(document.querySelectorAll(selector + ' tbody tr')).map(tr =>
          Array.from(tr.querySelectorAll('td')).map(td => {
            const c = td.querySelector('.cell');
            return escapeHtml(c ? c.innerText.trim() : '');
          })
        );
      }

      const schedRows = gatherTableRows('#scheduleTable');
      const scheduleHtml = `<div class="divider"></div><div class="section-title">Schedule</div><table>${schedRows.map(r => `<tr>${r.map(c => `<td class="left">${c}</td>`).join('')}</tr>`).join('')}</table>`;

      const keyRows = gatherTableRows('#keyGrid');
      const kiHtml = `<div class="divider"></div><div class="section-title">Key Indicators</div><table>${keyRows.map(r => `<tr>${r.map(c => `<td class="center">${c}</td>`).join('')}</tr>`).join('')}</table>`;

      const mediaRows = gatherTableRows('#mediaGrid');
      const mHtml = `<div class="divider"></div><div class="section-title">Media Referrals</div><table>${mediaRows.map(r => `<tr>${r.map(c => `<td class="center">${c}</td>`).join('')}</tr>`).join('')}</table>`;

      function buildItemsHtml(selector, textSel, placeholder) {

        '      var t=node.nodeValue;',
        '      if(/(missionary purpose|\\bmp\\b)/i.test(t)){',
        '        var sp=document.createElement("span");',
        '        sp.innerHTML=t.replace(/(missionary purpose|\\bmp\\b)/gi,function(m){',
        '          return "<span class=\\"mp-link\\" onclick=\\"showMPOverlay()\\">"+m+"</span>";',
        '        });',
        '        node.parentNode.replaceChild(sp,node);',
        '      }',
        '    } else if(node.nodeType===1&&node.tagName!=="SCRIPT"&&node.tagName!=="STYLE"&&node.tagName!=="A"){',
        '      Array.from(node.childNodes).forEach(wrapMP);',
        '    }',
        '  }',
        '  wrapMP(document.body);',
        '  document.documentElement.style.overscrollBehaviorY="none";',
        '  (function(){',
        '    var ENTRY="District Council Schedule v16",KEY="Ion-o-koji Watermark";',
        '    var logs=(localStorage.getItem(KEY)||"").split("\\n").map(function(l){return l.replace(/^- /,"").trim();}).filter(function(l){return l&&l!==ENTRY;});',
        '    logs.push(ENTRY);',
        '    localStorage.setItem(KEY,logs.map(function(i){return "- "+i;}).join("\\n"));',
        '  })();',
        '});',
        '<\/script>'
      ].join('\n');

      const mpOverlay = `
<div id="mp-overlay" onclick="if(event.target===this)closeMPOverlay()">
  <div id="mp-box">
    <h3>Missionary Purpose</h3>
    <div id="mp-text"></div>
    <div id="mp-btns">
      <button class="btn-en" onclick="showMPLang('en')">English</button>
      <button class="btn-kh" onclick="showMPLang('kh')">ខ្មែរ</button>
      <button class="btn-close" onclick="closeMPOverlay()">Close</button>
    </div>
  </div>
</div>`;

      return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>${escapeHtml(fullHeading)}</title><style>${css}</style></head><body>${mpOverlay}<div class="heading">${escapeHtml(fullHeading)}</div><div class="subheading">${escapeHtml(tuesdayDate)}</div>${scheduleHtml}${kiHtml}${mHtml}${goalsHtml}${tasksHtml}${exportedScript}</body></html>`;
    }

    // ─── Import ───────────────────────────────────────────────────────────────
    const importBtn = document.getElementById('importBtn');
    const fileImport = document.getElementById('fileImport');

    importBtn.addEventListener('click', () => fileImport.click());

    fileImport.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        const text = await f.text();
        parseAndLoadHtml(text);
        alert(`Imported: ${f.name}`);
      } catch (err) {
        alert('Import failed: ' + err.message);
      }
      fileImport.value = '';
    });

    // Import Last Exported
    document.getElementById('importLastBtn').addEventListener('click', () => {
      try {
        const lastHtml = localStorage.getItem('lastExportHtml');
        if (!lastHtml) {
          alert('No previous export found. Export first to save one.');
          return;
        }
        if (!confirm('Import from the last exported file? This will overwrite current data.')) return;
        parseAndLoadHtml(lastHtml);
        alert('Imported from last export.');
      } catch (err) {
        alert('Could not load last export: ' + err.message);
      }
    });

    function parseAndLoadHtml(htmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');

      const heading = doc.querySelector('.heading') || doc.querySelector('title');
      if (heading) {
        const headingText = heading.textContent.trim().replace(/\s*—\s*Export\s*$/, '').trim();
        const districtMatch = headingText.match(/^(.+?)\s+District\s+Council/i);
        const districtNameOnly = districtMatch ? districtMatch[1].trim() : headingText;
        document.getElementById('siteName').innerText = headingText;
        document.getElementById('districtInput').value = districtNameOnly;
      }

      function tableAfterTitle(text) {
        const el = Array.from(doc.querySelectorAll('.section-title, .title')).find(t => t.textContent.trim().toLowerCase().includes(text.toLowerCase()));
        if (!el) return null;
        let sib = el.nextElementSibling;
        while (sib && sib.tagName && sib.tagName.toLowerCase() !== 'table') sib = sib.nextElementSibling;
        return sib;
      }

      const schedParsed = tableAfterTitle('Schedule') || doc.querySelector('table');
      if (schedParsed) loadTableIntoLocal(schedParsed, '#scheduleTable');

      const keyParsed = tableAfterTitle('Key Indicators');
      if (keyParsed) loadTableIntoLocal(keyParsed, '#keyGrid');

      let mediaParsed = tableAfterTitle('Media Referrals');
      if (!mediaParsed && keyParsed) {
        let s = keyParsed.nextElementSibling;
        while (s && s.tagName && s.tagName.toLowerCase() !== 'table') s = s.nextElementSibling;
        mediaParsed = s;
      }
      if (!mediaParsed) {
        const allTables = Array.from(doc.querySelectorAll('table'));
        if (allTables.length >= 3) mediaParsed = allTables[2];
      }
      if (mediaParsed) loadTableIntoLocal(mediaParsed, '#mediaGrid');

      // Parse goals
      const goalTitle = Array.from(doc.querySelectorAll('.section-title, .title')).find(t => /goal/i.test(t.textContent));
      let goalEls = [];
      if (goalTitle) {
        let s = goalTitle.nextElementSibling;
        while (s) {
          if (s.classList && s.classList.contains('goal')) goalEls.push(s);
          const inside = s.querySelectorAll && s.querySelectorAll('.goal');
          if (inside && inside.length) goalEls.push(...inside);
          if (s.classList && (s.classList.contains('tasks-section') || (s.querySelector && s.querySelector('.title')))) break;
          s = s.nextElementSibling;
        }
      }
      if (!goalEls.length) {
        const allGoals = Array.from(doc.querySelectorAll('.goal'));
        goalEls = allGoals.slice(0, Math.ceil(allGoals.length / 2));
      }

      const goalsList = document.getElementById('goalsList');
      goalsList.innerHTML = '';
      goalEls.forEach(g => {
        const raw = g.textContent.trim();
        const markChar = (raw[0] === '✔' || raw[0] === 'X' || raw[0] === '✓') ? raw[0] : 'X';
        const text = raw.replace(/^[✔✓X\s]+/, '').trim();
        let details = [];
        const next = g.nextElementSibling;
        if (next && next.classList && next.classList.contains('goal-notes')) {
          details = Array.from(next.querySelectorAll('li')).map(li => li.textContent.trim()).filter(Boolean);
        }
        goalsList.appendChild(createGoalItem(text, markChar, details, false));
      });
      if (!goalsList.children.length) goalsList.appendChild(createGoalItem('', 'X', [], false));

      // Parse tasks
      const taskTitle = Array.from(doc.querySelectorAll('.section-title, .title')).find(t => /task/i.test(t.textContent));
      let taskEls = [];
      if (taskTitle) {
        let s = taskTitle.nextElementSibling;
        while (s) {
          if (s.classList && s.classList.contains('goal')) taskEls.push(s);
          const inside = s.querySelectorAll && s.querySelectorAll('.goal');
          if (inside && inside.length) taskEls.push(...inside);
          s = s.nextElementSibling;
        }
      }
      if (!taskEls.length) {
        const allGoals = Array.from(doc.querySelectorAll('.goal'));
        taskEls = allGoals.slice(Math.ceil(allGoals.length / 2));
      }

      const tasksList = document.getElementById('tasksList');
      tasksList.innerHTML = '';
      taskEls.forEach(t => {
        const raw = t.textContent.trim();
        const markChar = (raw[0] === '✔' || raw[0] === 'X' || raw[0] === '✓') ? raw[0] : 'X';
        const text = raw.replace(/^[✔✓X\s]+/, '').trim();
        let details = [];
        const next = t.nextElementSibling;
        if (next && next.classList && next.classList.contains('goal-notes')) {
          details = Array.from(next.querySelectorAll('li')).map(li => li.textContent.trim()).filter(Boolean);
        }
        tasksList.appendChild(createGoalItem(text, markChar, details, true));
      });
      if (!tasksList.children.length) tasksList.appendChild(createGoalItem('', 'X', [], true));
    }

    function loadTableIntoLocal(parsedTable, localSelector) {
      const localTable = document.querySelector(localSelector);
      if (!localTable) return;
      const parsedRows = Array.from(parsedTable.querySelectorAll('tr'));
      const tbody = localTable.tBodies[0] || localTable.appendChild(document.createElement('tbody'));
      tbody.innerHTML = '';
      parsedRows.forEach(pr => {
        const tr = document.createElement('tr');
        const cells = Array.from(pr.querySelectorAll('td, th'));
        if (cells.length === 0) {
          pr.textContent.split('\t').filter(Boolean).forEach(p => tr.appendChild(tdCell(p)));
        } else {
          cells.forEach(pc => tr.appendChild(tdCell(pc.innerText || pc.textContent || '')));
        }
        tbody.appendChild(tr);
      });

      function tdCell(text) {
        const td = document.createElement('td');
        const div = document.createElement('div');
        div.className = 'cell';
        div.contentEditable = 'true';
        div.innerText = text || '';
        td.appendChild(div);
        return td;
      }
    }

    // ─── Tab key navigation ───────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && document.activeElement && document.activeElement.isContentEditable) {
        e.preventDefault();
        const edits = Array.from(document.querySelectorAll('[contenteditable="true"]'));
        const idx = edits.indexOf(document.activeElement);
        const next = edits[(idx + 1) % edits.length];
        if (next) next.focus();
      }
    });

    // ─── Init ─────────────────────────────────────────────────────────────────
    function initGoalsAndTasks() {
      const goalsList = document.getElementById('goalsList');
      if (!goalsList.children.length) goalsList.appendChild(createGoalItem('', 'X', [], false));
      const tasksList = document.getElementById('tasksList');
      if (!tasksList.children.length) tasksList.appendChild(createGoalItem('', 'X', [], true));
    }

    initGoalsAndTasks();
    showPage('mainPage');

    (() => {
      const ENTRY = 'District Council Schedule Maker v16',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>

</html>

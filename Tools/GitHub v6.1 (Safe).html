                            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" class="search-input" id="searchInput" placeholder="Search repositories, users, code..." value="${escapeHtml(state.lastSearchQuery)}">
                        </div>
                    </div>
                </form>
                <div class="tabs">
                    <div class="tab ${state.searchType === 'repositories' ? 'active' : ''}" onclick="setSearchType('repositories')">Repositories</div>
                    <div class="tab ${state.searchType === 'users' ? 'active' : ''}" onclick="setSearchType('users')">Users</div>
                </div>
                <div id="searchResults">
                    ${state.searchResults ? renderSearchResults() : '<div class="empty-state">Enter a search query</div>'}
                </div>
            `;
    }

    function renderSearchResults() {
      if (!state.searchResults?.items?.length) {
        return '<div class="empty-state">No results found</div>';
      }

      if (state.searchType === 'users') {
        return `
                    <div class="card">
                        ${state.searchResults.items.map(user => `
                            <div class="org-item" onclick="viewUserProfile('${user.login}')">
                                <img class="org-avatar" src="${user.avatar_url}" alt="">
                                <div>
                                    <div style="font-weight: 600;">${escapeHtml(user.login)}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
      }

      const languages = [...new Set(state.searchResults.items.filter(r => r.language).map(r => r.language))].sort();
      const allLanguages = ['HTML', ...languages.filter(l => l !== 'HTML')];

      let filteredResults = [...state.searchResults.items]; // copy to avoid mutating cached results

      // Apply search filters
      if (state.searchFilters.language) {
        filteredResults = filteredResults.filter(r => r.language === state.searchFilters.language);
      }

      if (state.searchFilters.visibility) {
        filteredResults = filteredResults.filter(r => {
          if (state.searchFilters.visibility === 'private') return r.private;
          if (state.searchFilters.visibility === 'public') return !r.private;
          return true;
        });
      }

      if (state.searchFilters.size) {
        filteredResults = filteredResults.filter(r => {
          const size = r.size || 0;
          if (state.searchFilters.size === 'small') return size < 1024;
          if (state.searchFilters.size === 'medium') return size >= 1024 && size < 10240;
          if (state.searchFilters.size === 'large') return size >= 10240;
          return true;
        });
      }

      if (state.searchFilters.updated) {
        filteredResults.sort((a, b) => {
          const result = new Date(b.updated_at) - new Date(a.updated_at);
          return state.searchFilters.updated === 'asc' ? -result : result;
        });
      }

      if (state.searchFilters.stars) {
        filteredResults.sort((a, b) => {
          const result = b.stargazers_count - a.stargazers_count;
          return state.searchFilters.stars === 'asc' ? -result : result;
        });
      }

      if (state.searchFilters.forks) {
        filteredResults.sort((a, b) => {
          const result = b.forks_count - a.forks_count;
          return state.searchFilters.forks === 'asc' ? -result : result;
        });
      }

      // Pagination
      const itemsPerPage = 10;
      const totalItems = filteredResults.length;
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      const currentPage = state.searchPage || 1;
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedResults = filteredResults.slice(startIndex, endIndex);

      let paginationHTML = '';
      if (totalPages > 1) {
        paginationHTML = `
            <div class="pagination">
              ${currentPage > 1 ? `
                <button class="btn btn-secondary btn-sm" onclick="setSearchPage(${currentPage - 1})">← Previous</button>
              ` : ''}
              
              ${Array.from({ length: totalPages }, (_, i) => i + 1).map(page => `<button class="btn ${page === currentPage ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setSearchPage(${page})" style="min-width: 40px;">${page}</button>`).join('')}
              
              ${currentPage < totalPages ? `
                <button class="btn btn-secondary btn-sm" onclick="setSearchPage(${currentPage + 1})">Next →</button>
              ` : ''}
            </div>
          `;
      }

      return `
                <div class="collapsible-filters">
                    <button class="filter-toggle-btn" onclick="toggleFilterDropdown()">
                        ⚙️ Filters
                        <span id="filterChevron">▼</span>
                    </button>
                    <div class="filter-dropdown" id="filterDropdown">
                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Language</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('language', this.value)">
                                <option value="">All Languages</option>
                                ${allLanguages.map(lang => `
                                    <option value="${lang}" ${state.searchFilters.language === lang ? 'selected' : ''}>${lang}</option>
                                `).join('')}
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Visibility</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('visibility', this.value)">
                                <option value="">All</option>
                                <option value="public" ${state.searchFilters.visibility === 'public' ? 'selected' : ''}>Public</option>
                                <option value="private" ${state.searchFilters.visibility === 'private' ? 'selected' : ''}>Private</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Size</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('size', this.value)">
                                <option value="">All Sizes</option>
                                <option value="small" ${state.searchFilters.size === 'small' ? 'selected' : ''}>Small (&lt;1MB)</option>
                                <option value="medium" ${state.searchFilters.size === 'medium' ? 'selected' : ''}>Medium (1-10MB)</option>
                                <option value="large" ${state.searchFilters.size === 'large' ? 'selected' : ''}>Large (&gt;10MB)</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Recently Updated</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('updated', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.searchFilters.updated === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.searchFilters.updated === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Stars</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('stars', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.searchFilters.stars === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.searchFilters.stars === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>

                        <div class="filter-dropdown-group">
                            <label class="filter-dropdown-label">Forks</label>
                            <select class="filter-dropdown-select" onchange="updateSearchFilter('forks', this.value)">
                                <option value="">None</option>
                                <option value="desc" ${state.searchFilters.forks === 'desc' ? 'selected' : ''}>Descending</option>
                                <option value="asc" ${state.searchFilters.forks === 'asc' ? 'selected' : ''}>Ascending</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card">
                    ${paginatedResults.map(repo => `
                        <div class="repo-item" onclick="openRepo('${repo.owner.login}', '${repo.name}')">
                            <div class="repo-name">
                                <span>${escapeHtml(repo.full_name)}</span>
                                <span class="repo-visibility">${repo.private ? 'Private' : 'Public'}</span>
                            </div>
                            ${repo.description ? `<div class="repo-description">${escapeHtml(repo.description)}</div>` : ''}
                            <div class="repo-meta">
                                <span class="repo-meta-item">⭐ ${repo.stargazers_count}</span>
                                ${repo.language ? `<span class="repo-meta-item">${repo.language}</span>` : ''}
                                <span class="repo-meta-item">📦 ${formatBytes(repo.size * 1024)}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>

                ${paginationHTML}

                <div class="pagination-info">
                  Page ${currentPage} of ${totalPages} • Showing ${startIndex + 1}-${Math.min(endIndex, totalItems)} of ${totalItems} results
                </div>
            `;
    }

    function renderProfile() {
      if (!state.viewData) {
        state.viewData = state.user;
      }

      const user = state.viewData;

      return `
                <div class="profile-header">
                    <img class="profile-avatar" src="${escapeHtml(user.avatar_url)}" alt="">
                    <div class="profile-info">
                        <div class="profile-name">${escapeHtml(user.name || user.login)}</div>
                        <div class="profile-username">@${escapeHtml(user.login)}</div>
                        <div class="profile-stats">
                            <span class="profile-stat"><strong>${Number(user.followers).toLocaleString()}</strong> followers</span>
                            <span class="profile-stat"><strong>${Number(user.following).toLocaleString()}</strong> following</span>

                ${user.bio ? `<p style="margin-bottom: 16px;">${escapeHtml(user.bio)}</p>` : ''}

                <div class="card">
                    <div class="card-body">
                        ${user.company ? `<p>🏢 ${escapeHtml(user.company)}</p>` : ''}
                        ${user.location ? `<p>📍 ${escapeHtml(user.location)}</p>` : ''}
                        ${user.blog ? `<p>🔗 <a href="${safeUrl(user.blog)}" style="color: var(--text-link);" target="_blank" rel="noopener noreferrer">${escapeHtml(user.blog)}</a></p>` : ''}
                        ${user.twitter_username ? `<p>🐦 @${escapeHtml(user.twitter_username)}</p>` : ''}
                        <p>📚 ${Number(user.public_repos).toLocaleString()} public repos</p>
                        <p>📝 ${Number(user.public_gists).toLocaleString()} public gists</p>

    function renderNotifications() {
      if (!state.viewData) {
        loadNotifications();
        return renderLoading();
      }

      return `
                <div class="card">
                    ${state.viewData.map(notif => `
                        <div class="notification-item">
                            <div class="notification-icon" style="background: var(--bg-tertiary);">
                                🔔
                            </div>
                            <div class="notification-content">
                                <div class="notification-title">${escapeHtml(notif.subject.title)}</div>
                                <div class="notification-repo">${escapeHtml(notif.repository.full_name)}</div>
                            </div>
                        </div>
                    `).join('') || '<div class="empty-state">No notifications</div>'}
                </div>
            `;
    }

    function renderStarred() {
      if (!state.viewData) {
        loadStarred();
        return renderLoading();
      }

      return `
                <div class="card">
                    ${state.viewData.map(repo => `
                        <div class="repo-item" onclick="openRepo('${repo.owner.login}', '${repo.name}')">
                            <div class="repo-name">
                                <span>${escapeHtml(repo.full_name)}</span>
                            </div>
                            ${repo.description ? `<div class="repo-description">${escapeHtml(repo.description)}</div>` : ''}
                            <div class="repo-meta">
                                <span class="repo-meta-item">⭐ ${repo.stargazers_count}</span>
                                ${repo.language ? `<span class="repo-meta-item">${repo.language}</span>` : ''}
                            </div>
                        </div>
                    `).join('') || '<div class="empty-state">No starred repositories</div>'}
                </div>
            `;
    }

    function renderOrgs() {
      if (!state.viewData) {
        loadOrgs();
        return renderLoading();
      }

      return `
                <div class="card">
                    ${state.viewData.map(org => `
                        <div class="org-item" onclick="viewOrgRepos('${org.login}')">
                            <img class="org-avatar" src="${org.avatar_url}" alt="">
                            <div>
                                <div style="font-weight: 600;">${escapeHtml(org.login)}</div>
                                ${org.description ? `<div style="color: var(--text-secondary); font-size: 14px;">${escapeHtml(org.description)}</div>` : ''}
                            </div>
                        </div>
                    `).join('') || '<div class="empty-state">No organizations</div>'}
                </div>
            `;

    // Data loading functions
    async function loadUser() {
      try {
        state.user = await state.api.getUser();
        render();
      } catch (e) {
        showToast('Failed to load user: ' + e.message, 'error');
        signOut();
      }
    }

    async function loadHomeData() {
      const navId = state._navId;
      try {
        const repos = await state.api.getRepos();
        if (state._navId !== navId) return;
        state.viewData = { repos };
        render();
      } catch (e) {
        if (state._navId !== navId) return;
        showToast('Failed to load data: ' + e.message, 'error');
      }
    }

    async function loadRepos() {
      const navId = state._navId;
      try {
        const repos = await state.api.getRepos();
        if (state._navId !== navId) return;
        state.allRepos = repos;
        state.viewData = repos;
        render();
      } catch (e) {
        if (state._navId !== navId) return;
        showToast('Failed to load repositories: ' + e.message, 'error');
      }
    }

    async function loadRepo() {
      const navId = state._navId;
      try {
        const {
          owner,
          name
        } = state.currentRepo;
        const pathStr = state.currentPath.length > 0 ? state.currentPath.join('/') : '';
        const ref = state.currentBranch || undefined;
        const [repo, contents, isStarred, branches, isWatching] = await Promise.all([
          state.api.getRepo(owner, name),
          pathStr ? state.api.getContents(owner, name, pathStr, ref) : state.api.getContents(owner, name, '', ref),
          state.api.isStarred(owner, name),
          state.api.getBranches(owner, name).catch(() => []),
          state.api.isWatching(owner, name)
        ]);

        if (!state.currentBranch) {
          state.currentBranch = repo.default_branch || 'main';
        }

        let contentsArray = Array.isArray(contents) ? contents : [];

        let readme = null;
        if (state.currentPath.length === 0) {
          try {
            readme = await state.api.getReadme(owner, name, state.currentBranch);
          } catch (e) {}
        }

        if (state._navId !== navId) return;
        state.viewData = {
          repo,
          contents: contentsArray,
          readme,
          isStarred,
          branches,
          isWatching
        };
        render();
      } catch (e) {
        if (state._navId !== navId) return;
        showToast('Failed to load repository: ' + e.message, 'error');
      }
    }

    // ---- Branch management ----
    function switchBranch(branch) {
      state._navId++;
      state.currentBranch = branch;
      state.currentPath = [];
      state.viewData = null;
      render();
    }

    function showCreateBranchModal() {
      const branches = state.viewData?.branches || [];
      showModal('Create Branch', `
                <div class="input-group">
                    <label class="input-label">New Branch Name</label>
                    <input type="text" class="input" id="newBranchName" placeholder="feature/my-branch">
                </div>
                <div class="input-group">
                    <label class="input-label">Based On</label>
                    <select class="input" id="newBranchBase">
                        ${branches.map(b => `<option value="${b.name}" ${b.name === state.currentBranch ? 'selected' : ''}>${b.name}</option>`).join('')}
                    </select>
                </div>
            `, `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createBranchAction()">Create Branch</button>
            `);
    }

    async function createBranchAction() {
      const branchName = document.getElementById('newBranchName')?.value.trim();
      const base = document.getElementById('newBranchBase')?.value;
      if (!branchName) {
        showToast('Branch name is required', 'error');
        return;
      }
      try {
        const {
          owner,
          name
        } = state.currentRepo;
        const baseBranch = await state.api.getBranch(owner, name, base);
        await state.api.createBranch(owner, name, branchName, baseBranch.commit.sha);
        closeModal();
        showToast('Branch created: ' + branchName, 'success');
        state._navId++;
        state.currentBranch = branchName;
        state.viewData = null;
        render();
      } catch (e) {
        showToast('Failed to create branch: ' + e.message, 'error');
      }
    }

    // ---- Add file menu ----
    function toggleAddFileMenu() {
      document.getElementById('addFileMenu')?.classList.toggle('active');
    }

    function closeAddFileMenu() {
      document.getElementById('addFileMenu')?.classList.remove('active');
    }
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('addFileMenu');
      if (menu && !menu.contains(e.target) && !e.target.closest('.actions-bar')) {
        menu.classList.remove('active');
      }
    });

    // ---- Per-file/folder context menu ----
    function showFileItemMenu(btn) {
      document.querySelectorAll('.inline-file-menu').forEach(m => m.remove());
      const row = btn.closest('.file-item');
      const itemName = row.getAttribute('data-item-name');
      const itemPath = row.getAttribute('data-item-path');
      const itemType = row.getAttribute('data-item-type');
      const itemSha = row.getAttribute('data-item-sha');

      const menu = document.createElement('div');
      menu.className = 'filter-dropdown active inline-file-menu';
      menu.style.cssText = 'position:absolute; right:8px; margin-top:0; min-width:160px; z-index:60;';

      const renameDiv = document.createElement('div');
      renameDiv.className = 'nav-item';
      renameDiv.style.cssText = 'padding:8px 4px;';
      renameDiv.textContent = '✏️ Rename / Move';
      renameDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.remove();
        renameFileItem(itemPath, itemType, itemSha);
      });

      const deleteDiv = document.createElement('div');
      deleteDiv.className = 'nav-item';
      deleteDiv.style.cssText = 'padding:8px 4px; color: var(--accent-red);';
      deleteDiv.textContent = '🗑️ Delete';
      deleteDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.remove();
        deleteFileItem(itemPath, itemType, itemSha, itemName);
      });

      menu.appendChild(renameDiv);
      menu.appendChild(deleteDiv);
      row.style.position = 'relative';
      row.appendChild(menu);
      setTimeout(() => {
        document.addEventListener('click', function closer(ev) {
          if (!menu.contains(ev.target)) {
            menu.remove();
            document.removeEventListener('click', closer);
          }
        });
      }, 0);
    }

    function renameFileItem(oldPath, type, sha) {
      // Store context so confirmRenameFileItem can retrieve it without path-in-onclick issues
      state._renameCtx = { oldPath, type, sha };
      showModal(type === 'dir' ? 'Rename / Move Folder' : 'Rename / Move File', `
                <div class="input-group">
                    <label class="input-label">New Path</label>
                    <input type="text" class="input" id="renameNewPath" value="${escapeHtml(oldPath)}">
                </div>
                <div class="input-group">
                    <label class="input-label">Commit Message</label>
                    <input type="text" class="input" id="renameCommitMessage" placeholder="Rename ${escapeHtml(oldPath)}">
                </div>
            `, `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmRenameFileItem()">Rename</button>
            `);
    }

    async function confirmRenameFileItem() {
      const { oldPath, type } = state._renameCtx || {};
      if (!oldPath) { showToast('No rename context', 'error'); return; }
      const newPath = document.getElementById('renameNewPath')?.value.trim();
      const message = document.getElementById('renameCommitMessage')?.value.trim() || `Rename ${oldPath} to ${newPath}`;
      if (!newPath || newPath === oldPath) {
        showToast('Please provide a different path', 'error');
        return;
      }
      const {
        owner,
        name
      } = state.currentRepo;
      try {
        if (type === 'dir') {
          showToast('Renaming folder, please wait...', 'info');
          const tree = await state.api.getTree(owner, name, state.currentBranch, true);
          const filesInFolder = tree.tree.filter(t => t.type === 'blob' && t.path.startsWith(oldPath + '/'));
          for (const f of filesInFolder) {
            const fileData = await state.api.getContents(owner, name, f.path, state.currentBranch);
            const targetPath = newPath + f.path.slice(oldPath.length);
            await state.api.createOrUpdateFile(owner, name, targetPath, {
              message,
              content: fileData.content,
              branch: state.currentBranch
            });
            await state.api.deleteFile(owner, name, f.path, {
              message,
              sha: fileData.sha,
              branch: state.currentBranch
            });
          }
        } else {
          const fileData = await state.api.getContents(owner, name, oldPath, state.currentBranch);
          await state.api.createOrUpdateFile(owner, name, newPath, {
            message,
            content: fileData.content,
            branch: state.currentBranch
          });
          await state.api.deleteFile(owner, name, oldPath, {
            message,
            sha: fileData.sha,
            branch: state.currentBranch
          });
        }
        closeModal();
        showToast('Renamed successfully', 'success');
        state.viewData = null;
        loadRepo();
      } catch (e) {
        showToast('Failed to rename: ' + e.message, 'error');
      }
    }

    async function deleteFileItem(path, type, sha, itemName) {
      if (!confirm(`Delete "${itemName}"? This cannot be undone.`)) return;
      const {
        owner,
        name
      } = state.currentRepo;
      try {
        if (type === 'dir') {
          showToast('Deleting folder, please wait...', 'info');
          const tree = await state.api.getTree(owner, name, state.currentBranch, true);
          const filesInFolder = tree.tree.filter(t => t.type === 'blob' && t.path.startsWith(path + '/'));
          for (const f of filesInFolder) {
            await state.api.deleteFile(owner, name, f.path, {
              message: `Delete ${f.path}`,
              sha: f.sha,
              branch: state.currentBranch
            });
          }
        } else {
          await state.api.deleteFile(owner, name, path, {
            message: `Delete ${path}`,
            sha,
            branch: state.currentBranch
          });
        }
        showToast('Deleted successfully', 'success');
        state.viewData = null;
        loadRepo();
      } catch (e) {
        showToast('Failed to delete: ' + e.message, 'error');
      }
    }

    // ---- New folder ----
    function showCreateFolderModal() {
      showModal('New Folder', `
                <div class="input-group">
                    <label class="input-label">Folder Name</label>
                    <input type="text" class="input" id="newFolderName" placeholder="my-folder">
                </div>
                <div style="color: var(--text-secondary); font-size: 13px;">
                    Git tracks files, not empty folders — a placeholder <code>.gitkeep</code> file will be added automatically so the folder appears in your repository.
                </div>
            `, `
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmCreateFolder()">Create Folder</button>
            `);
    }

    async function confirmCreateFolder() {
      const folderName = document.getElementById('newFolderName')?.value.trim();
      if (!folderName) {
        showToast('Folder name is required', 'error');
        return;
      }
      const pathStr = state.currentPath.join('/');
      const fullPath = (pathStr ? pathStr + '/' + folderName : folderName) + '/.gitkeep';
      try {
        const {
          owner,
          name
        } = state.currentRepo;
        await state.api.createOrUpdateFile(owner, name, fullPath, {
          message: `Create folder ${folderName}`,
          content: '',
          branch: state.currentBranch
        });
        closeModal();
        showToast('Folder created', 'success');
        state.viewData = null;

    async function handleUploadFiles(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      const pathStr = state.currentPath.join('/');
      const {
        owner,
        name
      } = state.currentRepo;
      showToast(`Uploading ${files.length} file(s)...`, 'info');
      for (const file of files) {
        try {
          const base64 = await fileToBase64(file);
          const targetPath = pathStr ? pathStr + '/' + file.name : file.name;
          await state.api.createOrUpdateFile(owner, name, targetPath, {
            message: `Add ${file.name}`,
            content: base64,
            branch: state.currentBranch
          });
        } catch (e) {
          showToast(`Failed to upload ${file.name}: ${e.message}`, 'error');
        }
      }
      showToast('Upload complete', 'success');
      event.target.value = '';
      state.viewData = null;
      loadRepo();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function performSearch(query) {
      state._navId++;
      const navId = state._navId;
      try {
        let allResults = [];

        // Fetch first 5 pages (150 results total)
        for (let page = 1; page <= 5; page++) {
          if (state._navId !== navId) return; // navigated away mid-search
          try {
            if (state.searchType === 'repositories') {
              const pageResults = await state.api.searchRepos(query, page);
              if (!pageResults.items || pageResults.items.length === 0) break;
              allResults = allResults.concat(pageResults.items);
            } else {
              const pageResults = await state.api.searchUsers(query, page);
              if (!pageResults.items || pageResults.items.length === 0) break;
              allResults = allResults.concat(pageResults.items);
            }
          } catch (e) {
            break;
          }
        }

        if (state._navId !== navId) return; // navigated away after last page
        state.searchResults = {
          items: allResults,
          total_count: allResults.length
        };
        state.filterDropdownOpen = false;
        render();
      } catch (e) {
        if (state._navId !== navId) return;
        showToast('Search failed: ' + e.message, 'error');
      }
    }

    function editFile() {
      // Safely decode Base64 to UTF-8 (supporting emojis and special characters)
      let content = '';
      try {
        const binString = atob(state.viewData.file.content.replace(/\s/g, ''));
        const bytes = Uint8Array.from(binString, (m) => m.charCodeAt(0));
        content = new TextDecoder().decode(bytes);
      } catch (e) {
        // Fallback if decoding fails — still strip GitHub's line-wrapping whitespace
        try { content = atob((state.viewData.file.content || '').replace(/\s/g, '')); } catch (_) {}
      }

      showModal('Edit File', `
        <div class="input-group">
            <label class="input-label">Content</label>
            <textarea class="textarea" id="editFileContent" style="min-height: 300px; font-family: monospace;">${escapeHtml(content)}</textarea>
        </div>
        <div class="input-group">
            <input type="text" class="input" id="editFileName" placeholder="File Name" value="${escapeHtml(state.viewData.file.name)}">
        </div>
        <div class="input-group">
            <input type="text" class="input" id="editCommitMessage" placeholder="Commit Message">
        </div>
    `, `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveFile()">Commit Changes</button>
    `);
    }

    // Helper to safely convert UTF-8 (including emojis) to Base64
    function toBase64(str) {
      const bytes = new TextEncoder().encode(str);
      const binString = Array.from(bytes, (byte) => String.fromCharCode(byte)).join("");
      return btoa(binString);
    }

    async function saveFile() {
      const content = document.getElementById('editFileContent')?.value || '';
      const newName = document.getElementById('editFileName')?.value.trim() || state.viewData.file.name;
      const message = document.getElementById('editCommitMessage')?.value.trim() || `Update ${newName}`;

      try {
        const {
          owner,
          name,
          path
        } = state.currentFile;

        // Calculate the new path if the file name was changed
        const pathParts = path.split('/');
        pathParts[pathParts.length - 1] = newName;
        const newPath = pathParts.join('/');

        // Safe Base64 encoding for emojis and special characters
        const encodedContent = toBase64(content);

        if (newPath !== path) {
          // Create the new file with updated content
          await state.api.createOrUpdateFile(owner, name, newPath, {
            message: message || `Rename ${state.viewData.file.name} to ${newName}`,
            content: encodedContent,
            branch: state.currentBranch
          });
          // Delete the old file
          await state.api.deleteFile(owner, name, path, {
            message: `Delete ${state.viewData.file.name} (renamed to ${newName})`,
            sha: state.viewData.file.sha,
            branch: state.currentBranch
          });
        } else {
          // Standard update if name didn't change
          await state.api.createOrUpdateFile(owner, name, path, {
            message,
            content: encodedContent,
            sha: state.viewData.file.sha,
            branch: state.currentBranch
          });
        }

        closeModal();
        showToast('File updated', 'success');
        state.viewData = null;
        openFile(owner, name, newPath);
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

      try {
        await state.api.deleteGist(id);
        showToast('Gist deleted', 'success');
        navigate('gists');
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function viewUserProfile(username) {
      state._navId++;
      const navId = state._navId;
      state.currentView = 'profile';
      state.viewData = null;
      pushHistory();
      render(); // show loading spinner immediately
      try {
        const profile = await state.api.getUserProfile(username);
        if (state._navId !== navId) return; // navigated away while loading
        state.viewData = profile;
        render();
      } catch (e) {
        if (state._navId !== navId) return;
        showToast('Failed to load profile: ' + e.message, 'error');
      }
    }

    async function viewOrgRepos(org) {
      state._navId++;
      const navId = state._navId;
      state.currentView = 'repos';
      state.viewData = null;
      pushHistory();
      render(); // shows loading spinner immediately
      try {
        const repos = await state.api.getOrgRepos(org);
        if (state._navId !== navId) return;
        state.allRepos = repos; // keep allRepos in sync for language filter
        state.viewData = repos;
        render();
      } catch (e) {
        if (state._navId !== navId) return;
        showToast('Failed to load repos: ' + e.message, 'error');
      }
    }

    // Sanitize a user-supplied URL using an allowlist of safe schemes.
    // Returns '#' for anything that does not match http/https/mailto.
    // Bare strings with no scheme (e.g. "example.com") get https:// prepended.
    function safeUrl(url) {
      if (!url) return '';
      const s = url.trim();
      const hasScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s);
      if (!hasScheme) {
        // Bare domain/path — assume https
        return ('https://' + s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      // Only allow http, https, and mailto
      if (/^https?:\/\//i.test(s) || /^mailto:/i.test(s)) {
        return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      return '#'; // reject javascript:, data:, vbscript:, and any other scheme
    }

    // Utilities
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML
        .replace(/'/g, '&#39;')
        .replace(/"/g, '&quot;');
    }

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      const intervals = [{
          label: 'year',
          seconds: 31536000
        },
        {
          label: 'month',
          seconds: 2592000
        },
        {
          label: 'day',
          seconds: 86400
        },
        {
          label: 'hour',
          seconds: 3600
        },
        {
          label: 'minute',
          seconds: 60
        }
      ];

      for (const interval of intervals) {
        const count = Math.floor(seconds / interval.seconds);
        if (count >= 1) {
          return `${count} ${interval.label}${count > 1 ? 's' : ''} ago`;
        }
      }
      return 'just now';
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // Initialize
    render();

    (() => {
      const ENTRY = 'GitHub v6.1 (Safe)',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>

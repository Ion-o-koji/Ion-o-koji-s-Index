<!DOCTYPE html>
<!-- By Ion-o-koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Link Decoder v1</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Card */
    .container {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    /* Typography */
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      color: #f3f4f6;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 1.75rem;
      line-height: 1.4;
    }

    /* Input Group */
    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    #urlInput {
      width: 100%;
      padding: 14px 45px 14px 16px;
      background-color: #1f2937;
      border: 2px solid #374151;
      border-radius: 10px;
      color: #f9fafb;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    #urlInput::placeholder {
      color: #6b7280;
    }

    #urlInput:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    #clearBtn {
      position: absolute;
      right: 12px;
      background-color: #374151;
      border: none;
      color: #9ca3af;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    #clearBtn:hover {
      background-color: #4b5563;
      color: #f3f4f6;
    }

    /* Buttons */
    .actions {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      width: 100%;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      width: auto;
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .btn-secondary:hover {
      background-color: #374151;
      border-color: #4b5563;
    }

    /* Results Section */
    .result-container {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid #1f2937;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-container h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin-bottom: 0.75rem;
    }

    .output-box {
      background-color: #0b0f19;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 14px;
      word-break: break-all;
      margin-bottom: 1rem;
      max-height: 120px;
      overflow-y: auto;
    }

    #decodedLink {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.9rem;
      line-height: 1.5;
      transition: color 0.15s ease;
    }

    #decodedLink:hover {
      color: #93c5fd;
      text-decoration: underline;
    }

    .result-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .feedback {
      color: #10b981;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .feedback.show {
      opacity: 1;
    }

    /* Helper Class */
    .hidden {
      display: none !important;
    }

  </style>
</head>

<body>
  <div class="container">
    <h1>FB Link Decoder</h1>
    <p class="subtitle">Paste your Facebook redirect link below to extract the clean URL.</p>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste l.facebook.com link here..." autofocus autocomplete="off">
      <button id="clearBtn" onclick="clearInput()" title="Clear input">×</button>
    </div>

    <div class="actions">
      <button onclick="decodeLink()" class="btn btn-primary">Decode Link</button>
    </div>

    <div id="resultContainer" class="result-container hidden">
      <h3>Decoded Link:</h3>
      <div class="output-box">
        <a id="decodedLink" href="#" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="result-actions" style="display:none;">
        <button onclick="copyToClipboard()" class="btn btn-secondary">Copy to Clipboard</button>
        <span id="copyFeedback" class="feedback">Copied!</span>
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const resultContainer = document.getElementById('resultContainer');
    const decodedLinkEl = document.getElementById('decodedLink');
    const copyFeedback = document.getElementById('copyFeedback');

    // Automatically decode as user types or pastes
    urlInput.addEventListener('input', decodeLink);

    function decodeLink() {
      const inputVal = urlInput.value.trim();

      if (!inputVal) {
        resultContainer.classList.add('hidden');
        return;
      }

      try {
        let decodedUrl = '';

        // Check if it's a valid URL structure
        if (inputVal.startsWith('http://') || inputVal.startsWith('https://')) {
          const url = new URL(inputVal);

          // Extract 'u' parameter if it's a Facebook redirect
          if (url.hostname.includes('facebook.com') && url.searchParams.has('u')) {
            decodedUrl = decodeURIComponent(url.searchParams.get('u'));
          } else {
            decodedUrl = decodeURIComponent(inputVal);
          }
        } else {
          // Fallback for partial links or raw encoded strings
          decodedUrl = decodeURIComponent(inputVal);
        }

        if (decodedUrl) {
          decodedLinkEl.href = decodedUrl;
          decodedLinkEl.textContent = decodedUrl;
          resultContainer.classList.remove('hidden');
        }
      } catch (e) {
        // Fallback in case URL parsing fails
        try {
          const decodedUrl = decodeURIComponent(inputVal);
          decodedLinkEl.href = decodedUrl;
          decodedLinkEl.textContent = decodedUrl;
          resultContainer.classList.remove('hidden');
        } catch (err) {
          resultContainer.classList.add('hidden');
        }
      }
    }

    /*        function copyToClipboard() {
                const text = decodedLinkEl.textContent;
                navigator.clipboard.writeText(text).then(() => {
                    copyFeedback.classList.add('show');
                    setTimeout(() => {
                        copyFeedback.classList.remove('show');
                    }, 2000);
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                });
            }
    */
    function clearInput() {
      urlInput.value = '';
      resultContainer.classList.add('hidden');
      urlInput.focus();
    }

    (() => {
      const ENTRY = 'Facebook Link Decoder v1',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>

</html>

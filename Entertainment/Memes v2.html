<!DOCTYPE html>
<!-- By Ion-o-koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memes v2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #00ffcc;
      margin-bottom: 10px;
    }

    button {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }

    button:hover {
      background: #00ccaa;
    }

    #meme-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .meme {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .meme img {
      width: 100%;
      border-radius: 6px;
    }

    .meme p {
      margin: 8px 0 0;
      font-size: 14px;
    }

  </style>
</head>

<body>
  <h1>Meme Finder</h1>
  <p>Click below to load new memes from the internet</p>
  <button onclick="loadMeme()">Load One Meme</button>

  <button onclick="loadManyMemes()">Load 10 Memes</button>

  <div id="meme-container"></div>

  <button onclick="loadManyMemes()">Load 10 Memes</button>

  <script>
    var APP_VERSION = "v2";
    const proxy = "";
    const memeContainer = document.getElementById('meme-container');

    async function loadMeme() {
      const res = await fetch(proxy + 'https://meme-api.com/gimme');
      const data = await res.json();
      displayMemes([data]);
    }

    async function loadManyMemes() {
      const res = await fetch(proxy + 'https://meme-api.com/gimme/10');
      const data = await res.json();
      displayMemes(data.memes);
    }

    function displayMemes(memes) {
      memeContainer.innerHTML = '';
      memes.forEach(meme => {
        const div = document.createElement('div');
        div.className = 'meme';
        div.innerHTML = `
      <img src="${meme.url}" alt="Meme">
      <p><strong>${meme.title}</strong></p>
      <p>From: ${meme.subreddit}</p>
    `;
        memeContainer.appendChild(div);
      });
    };
    (()=>{const NAME="Memes"+(typeof APP_VERSION!=="undefined"?" "+APP_VERSION:""),VERSION="v4",KEY="Ion-o-koji's Watermark "+VERSION,TITLES_KEY="Ion-o-koji's Watermark Titles "+VERSION;function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}function now(){return new Date().toISOString()}function fmt(iso){try{return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return iso}}function getLoadTime(){try{const n=performance.getEntriesByType("navigation")[0];if(n&&n.loadEventEnd>0)return Math.round(n.loadEventEnd);const t=performance.timing;if(t&&t.loadEventEnd>0)return t.loadEventEnd-t.navigationStart}catch(e){}return null}function entryName(b){const m=b.match(/^> (.+)/);return m?m[1].trim():null}function buildEntry(first,last,count,lt,avg){let s="> "+NAME+"\n  - First opened: "+first+"\n  - Last opened: "+last+"\n  - Opened: "+count+" times";if(lt!=null)s+="\n  - Load time: "+lt+"ms";if(avg!=null)s+="\n  - Avg load time: "+avg+"ms";return s}function parseEntries(raw){if(!raw)return[];const res=[];let cur=[];for(const line of raw.split("\n")){if(/^> /.test(line)&&cur.length>0){const b=cur.join("\n").trimEnd();if(b)res.push(b);cur=[];}cur.push(line);}if(cur.length>0){const b=cur.join("\n").trimEnd();if(b&&/^> /.test(b))res.push(b);}return res}function parseEntry(b){if(!b)return null;const lines=b.split("\n"),get=f=>{const l=lines.find(l=>l.trim().startsWith("- "+f+": "));return l?l.trim().slice(f.length+3).trim():null},first=get("First opened"),opened=get("Opened");if(!first||!opened)return null;const count=parseInt(opened,10),avgStr=get("Avg load time");return{first,count:isNaN(count)?0:count,avgLoad:avgStr?parseInt(avgStr,10):null}}function updateTitles(){try{const raw=ls(TITLES_KEY)||"",others=raw.split("\n").map(l=>l.trim().replace(/^> /,"")).filter(l=>l&&l!==NAME);ls(TITLES_KEY,["> "+NAME,...others.map(l=>"> "+l)].join("\n"));}catch(e){}}try{const nowFmt=fmt(now()),lt=getLoadTime(),entries=parseEntries(ls(KEY)),existingIdx=entries.findIndex(b=>entryName(b)===NAME),existing=parseEntry(existingIdx>=0?entries[existingIdx]:null),others=entries.filter((_,i)=>i!==existingIdx),oldCount=existing?.count??0,newCount=oldCount+1,prevAvg=existing?.avgLoad??null;let newAvg=null;if(lt!=null)newAvg=(prevAvg!=null&&oldCount>0)?Math.round((prevAvg*oldCount+lt)/newCount):lt;else newAvg=prevAvg;const first=existing?.first??nowFmt;ls(KEY,[buildEntry(first,nowFmt,newCount,lt,newAvg),...others].join("\n\n"));updateTitles();}catch(e){}})();
  </script>
</body>

</html>

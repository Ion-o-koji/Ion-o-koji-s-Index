<!DOCTYPE html>
<!-- By Ion-o-koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <title>Jades World Searcher v2</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --mint: #2ea043;
      --mint-bg: #2ea0431a;
      --mint-sel: #2ea04333;
      --err: #f85149;
      --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 var(--font);
      overscroll-behavior-y: none
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 12px
    }

    header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .header-bottom {
      display: flex;
      align-items: center;
      min-height: 18px
    }

    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--mint);
      line-height: 1
    }

    .row.loading-more {
      opacity: .7;
      pointer-events: none;
    }

    .row.loading-more.name.center {
      text-align: center;
    }

    .spinner.sm {
      width: 14px;
      height: 14px;
      border-width: 2px;
      display: inline-block;
      vertical-align: middle;
    }

    .spacer {
      flex: 1
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap
    }

    input,
    button {
      font: inherit;
      background: #0d1117;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px
    }

    button.primary {
      background: var(--mint);
      border-color: var(--mint);
      color: #0d1117;
      font-weight: 600;
      cursor: pointer
    }

    button.secondary {
      background: #0d1117;
      border: 1px solid var(--err);
      color: var(--err);
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center
    }

    button.secondary:hover {
      background: var(--err);
      color: #0d1117
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .bc {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      flex-wrap: wrap
    }

    .bc a {
      color: var(--mint);
      text-decoration: none;
      cursor: pointer
    }

    .bc a:hover {
      text-decoration: underline
    }

    .bc.sep {
      color: var(--muted)
    }

    .list {
      flex: 1;
      overflow: auto;
      position: relative;
      touch-action: pan-y
    }

    .ptr {
      position: absolute;
      top: -48px;
      left: 0;
      right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      gap: 6px;
      transition: transform.2s ease
    }

    .ptr.active {
      color: var(--mint)
    }

    .row {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 7px 14px;
      border-bottom: 1px solid transparent;
      user-select: none;
      -webkit-user-select: none
    }

    .row:hover {
      background: var(--mint-bg)
    }

    .row.selected {
      background: var(--mint-sel)
    }

    .row.head {
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--panel);
      z-index: 1
    }

    .icon {
      width: 16px;
      height: 16px;
      color: var(--muted);
      flex-shrink: 0
    }

    .material-icons.icon {
      font-size: 18px;
      vertical-align: middle;
      margin-right: 6px;
    }

    .icon.movie {
      color: #4ec9b0;
    }

    .icon.series {
      color: #4ec9b0;
    }

    .icon.season {
      color: #4ec9b0;
    }

    .icon.episode {
      color: #4ec9b0;
    }

    .icon.boxset {
      color: #4ec9b0;
    }

    .icon.album {
      color: #ce9178;
    }

    .icon.audio {
      color: #ce9178;
    }

    .icon.artist {
      color: #ce9178;
    }

    .icon.book {
      color: #dcdcaa;
    }

    .icon.photo {
      color: #b5cea8;
    }

    .icon.playlist {
      color: #9cdcfe;
    }

    .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer
    }

    .name:hover {
      color: var(--mint);
      text-decoration: underline
    }

    .meta-right {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      text-align: right;
      min-width: 80px
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--mint);
      border-radius: 50%;
      animation: spin.8s linear infinite;
      display: inline-block;
      vertical-align: middle
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 32px;
      color: var(--muted)
    }

    .hidden {
      display: none
    }

    .err {
      color: var(--err)
    }

    svg {
      vertical-align: middle
    }

    .select-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%
    }

    .select-bar.count {
      font-weight: 600;
      color: var(--mint)
    }

  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="header-top">
        <i class="material-icons icon folder">folder</i>
        <h1 id="repoTitle">jadesworlds.com</h1>
        <div class="spacer"></div>
        <button id="logoutBtn" class="secondary hidden" title="Sign out">
          <svg class="icon" style="width:14px;height:14px;color:var(--err)" viewBox="0 0 16 16">
            <path fill="currentColor" d="M6 2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V2zm3 5.5a.5.5 0 0 0-1 0V8H2a.5.5 0 0 0 0 1h6v.5a.5.5 0 0 0 1 0V7.5z" />
          </svg>
        </button>
      </div>
      <div class="header-bottom" id="headerBottom">
        <input id="search" placeholder="Search..." style="width:100%;margin-right:8px">
        <div id="status" class="meta">Idle</div>
      </div>
    </header>

    <div id="login" class="card" style="flex:0 0 auto">
      <div style="padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600">Sign in to Jellyfin</div>
      <div style="padding:14px;display:grid;gap:8px">
        <input id="server" placeholder="Server URL" value="https://jadesworlds.com">
        <input id="user" placeholder="Username or Email" autocomplete="username">
        <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn" class="primary">Connect</button>
        <div id="loginMsg" class="meta"></div>
      </div>
    </div>

    <div id="browser" class="card hidden">
      <div class="bc" id="bc"></div>
      <div class="list" id="list">
        <div class="ptr" id="ptr">
          <div class="spinner hidden" id="ptrSpin"></div><span id="ptrTxt">Pull to refresh</span>
        </div>
        <div id="listContent"></div>
      </div>
    </div>
  </div>
  <script>
    const DEBUG = true;
    const log = (...a) => {
      if (DEBUG) console.log('[JF]', ...a)
    };
    const CFG = {
      LIMIT: 2000,
      CACHE_MAX: 500,
      PULL_THRESHOLD: 80,
      LONG_PRESS_MS: 500
    };
    const $ = id => document.getElementById(id);
    const fmtBytes = b => !b ? '' : b < 1024 ? b + ' B' : b < 1e6 ? (b / 1024).toFixed(1) + ' KB' : b < 1e9 ? (b / 1e6).toFixed(1) + ' MB' : (b / 1e9).toFixed(2) + ' GB';
    const sanitizeFilename = s => s.replace(/[\\/:*?"<>|]+/g, '_').trim();

    const STATE = {
      server: localStorage.getItem('jf_s') || 'https://jadesworlds.com',
      token: localStorage.getItem('jf_t') || '',
      userId: localStorage.getItem('jf_u') || '',
      deviceId: localStorage.getItem('jf_d') || crypto.randomUUID(),
      path: [],
      cache: new Map(), // [IDB] hot cache
      loadingCtrl: null,
      ptr: {
        startY: 0,
        pulling: false
      },
      selectMode: false,
      selected: new Set()
    };
    localStorage.setItem('jf_d', STATE.deviceId);

    // [FSA] Session folder handle + progress tabs
    let dirHandle = null;
    const dlTabs = new Map();

    const RAM_ITEMS = new Map(); // [FIX] flat index for O(1) search + dedupe
    const LRU = new Map(); // [FIX] real LRU: insert order = last used
    const touch = id => {
      LRU.delete(id);
      LRU.set(id, true);
    };

    // [IDB] Persistent cache helper v3 + callback counters
    const IDB = {
      db: null,
      async open() {
        if (this.db) return this.db;
        this.db = await new Promise((res, rej) => {
          const req = indexedDB.open('jf_cache_v3', 3); // v2 -> v3
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders');
            if (!db.objectStoreNames.contains('tree')) db.createObjectStore('tree'); // parentId -> [childIds]

            if (!db.objectStoreNames.contains('items')) {
              // [SEARCH] flat store for search
              const s = db.createObjectStore('items', {
                keyPath: 'Id'
              });
              s.createIndex('name', 'Name', {
                unique: false
              });
              s.createIndex('parent', 'ParentId', {
                unique: false
              }); // [SCOPED SEARCH]
            } else {
              // [UPGRADE] v2 -> v3: add parent index if missing
              const s = req.transaction.objectStore('items');
              if (!s.indexNames.contains('parent')) s.createIndex('parent', 'ParentId', {
                unique: false
              });
            }
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
        return this.db;
      },

      // [INTERNAL] 1-time count, returns Promise
      async _rawCount(store) {
        const db = await this.open();
        return new Promise(res => {
          const tx = db.transaction(store, 'readonly');
          tx.objectStore(store).count().onsuccess = e => res(e.target.result || 0);
        });
      },

      // [NON-BLOCKING] Callback wrappers. No await needed by caller.
      countItems(cb) { // files + folders total
        this._rawCount('items')
          .then(total => {
            log(`[IDB] items: ${total}`);
            cb?.(total);
          })
          .catch(e => {
            log('[IDB] countItems fail', e);
            cb?.(0);
          });
      },
      countFolders(cb) { // folders only
        this._rawCount('folders')
          .then(total => {
            log(`[IDB] folders: ${total}`);
            cb?.(total);
          })
          .catch(e => {
            log('[IDB] countFolders fail', e);
            cb?.(0);
          });
      },
      countByType(cb) { // {Folder: 12, Movie: 34, Book: 5}
        this.open().then(db => {
          const tx = db.transaction('items', 'readonly');
          const req = tx.objectStore('items').getAll();
          req.onsuccess = () => {
            const out = {};
            for (const it of req.result || []) out[it.Type] = (out[it.Type] || 0) + 1;
            log(`[IDB] byType:`, out);
            cb?.(out);
          };
          req.onerror = () => cb?.({});
        });
      },

      async get(id) {
        const db = await this.open();
        return new Promise(res => {
          const tx = db.transaction('folders', 'readonly');
          const r = tx.objectStore('folders').get(id);
          r.onsuccess = () => {
            const v = r.result;
            if (!v) return res(null);
            touch(id);

            if (Array.isArray(v)) return res({
              items: v,
              meta: {
                complete: true,
                total: v.length
              },
              ts: 0
            }); // v2
            if (!v.meta) return res({
              items: v.items,
              meta: {
                complete: true,
                total: v.items.length
              },
              ts: v.ts || 0
            }); // v3

            return res(v); // v4 {items, meta, ts}
          };
          r.onerror = () => res(null);
        });
      },

      async put(id, items, meta = {
        complete: true,
        total: items.length
      }) { // [V4.1] add meta
        const db = await this.open();
        const ts = Date.now();
        const blob = {
          ts,
          items,
          meta
        };

        return new Promise((res, rej) => {
          const tx = db.transaction(['folders', 'items'], 'readwrite');
          const foldersStore = tx.objectStore('folders');
          const itemsStore = tx.objectStore('items');

          foldersStore.put(blob, id); // [V4.1] blob with meta

          const bulk = [];
          for (const it of items) {
            if (it?.id && it?.name) {
              bulk.push({
                Id: it.id,
                Name: it.name,
                Type: it.type,
                ProductionYear: it.ProductionYear,
                ParentId: id || ''
              });
              RAM_ITEMS.set(it.id, {
                ...it,
                ParentId: id || ''
              });
            }
          }
          for (const rec of bulk) itemsStore.put(rec);

          tx.oncomplete = () => {
            touch(id);
            res();
          };

          tx.onerror = () => rej(tx.error);
        });
      },

      async del(id) {
        const db = await this.open();
        const tx = db.transaction('folders', 'readwrite');
        tx.objectStore('folders').delete(id);
      },

      async getChildren(parentId) {
        const db = await this.open();
        return new Promise(res => {
          const tx = db.transaction('tree', 'readonly');
          const r = tx.objectStore('tree').get(parentId);
          r.onsuccess = () => res(r.result || []);
        });
      },

      async setChildren(parentId, childIds) {
        const db = await this.open();
        return new Promise(res => {
          const tx = db.transaction('tree', 'readwrite');
          tx.objectStore('tree').put(childIds, parentId);
          tx.oncomplete = res;
        });
      },

      async delTree(parentId) {
        const db = await this.open();
        const toDelete = [parentId];
        const seen = new Set();

        // [FIX] 1. Collect all ids first, no awaits in loop
        for (let i = 0; i < toDelete.length; i++) {
          const id = toDelete[i];
          if (seen.has(id)) continue;
          seen.add(id);
          const kids = await this.getChildren(id); // only await here
          toDelete.push(...kids);
        }

        // [FIX] 2. 1 transaction to nuke everything
        return new Promise((res, rej) => {
          const tx = db.transaction(['folders', 'tree', 'items'], 'readwrite');
          const f = tx.objectStore('folders');
          const t = tx.objectStore('tree');
          const s = tx.objectStore('items');
          const parentIdx = s.indexNames.contains('parent') ? s.index('parent') : null;

          for (const id of seen) {
            f.delete(id);
            t.delete(id);
            RAM_ITEMS.forEach((v, k) => {
              if (v.ParentId === id) RAM_ITEMS.delete(k);
            }); // [FIX] purge RAM
            LRU.delete(id); // [FIX] purge LRU
            if (parentIdx) parentIdx.openCursor(IDBKeyRange.only(id)).onsuccess = e => {
              const c = e.target.result;
              if (c) {
                s.delete(c.primaryKey);
                c.continue();
              }
            };
          }
          tx.oncomplete = res;
          tx.onerror = () => rej(tx.error);
        });
      },

      async clear() {
        const db = await this.open();
        const tx = db.transaction(['folders', 'tree', 'items'], 'readwrite');
        tx.objectStore('folders').clear();
        tx.objectStore('tree').clear();
        tx.objectStore('items').clear();
      },

      async getAllIds() {
        const db = await this.open();
        return new Promise(res => {
          const tx = db.transaction('items', 'readonly');
          const r = tx.objectStore('items').getAllKeys();
          r.onsuccess = () => res(r.result || []);
        });
      },

      // [SEARCH] Scoped FUZZY search
      async searchByName(q, limit = 200, parentId = '') {
        if (!q) return [];
        q = q.toLowerCase();
        const db = await this.open();

        return new Promise(res => {
          const tx = db.transaction('items', 'readonly');
          const s = tx.objectStore('items');
          const out = [];
          const seen = new Set();

          // [FUZZY] Score function: higher = better match
          const fuzzyScore = (name) => {
            name = name.toLowerCase();
            let score = 0;
            let i = 0;
            for (const ch of q) {
              i = name.indexOf(ch, i);
              if (i === -1) return 0; // letter not found = no match
              score++;
              i++;
            }
            if (name.startsWith(q)) score += 20;
            if (name.includes(q)) score += 10;
            return score;
          };

          const pumpCursor = (req) => {
            req.onsuccess = () => {
              const cursor = req.result;
              if (!cursor || out.length >= limit) {
                // sort by score before returning
                return res(out.sort((a, b) => b._score - a._score));
              }
              const it = cursor.value;
              if (!seen.has(it.Id)) {
                const score = fuzzyScore(it.Name);
                if (score > 0) { // [FUZZY] match
                  seen.add(it.Id);
                  out.push({
                    ...it,
                    _score: score
                  });
                }
              }
              cursor.continue();
            };
          };

          if (parentId && s.indexNames.contains('parent')) {
            // [OPTIMIZED] Scoped: only scan this folder's children
            pumpCursor(s.index('parent').openCursor(IDBKeyRange.only(parentId)));
          } else {
            // [OPTIMIZED] Global: start at q prefix to skip 90% of DB
            // "spider" will start at "spider" not "a"
            pumpCursor(s.index('name').openCursor(IDBKeyRange.bound(q, q + '\uffff')));
          }
        });
      }
    };

    function setStatus(t) {
      $('status').textContent = t;
    }

    const authH = (withToken = true) => ({
      'X-Emby-Authorization': `MediaBrowser Client="Jellyfin Repo", Device="Web", DeviceId="${STATE.deviceId}", Version="12.9"${withToken&&STATE.token?`, Token="${STATE.token}"`:''}`
    });

    async function jf(path, opts = {}) {
      // [SEARCH] add params support
      const base = STATE.server.replace(/\/$/, '') + path;
      const url = new URL(base);
      if (opts.params) Object.entries(opts.params).forEach(([k, v]) => v != null && url.searchParams.set(k, v));

      log('->', opts.method || 'GET', url.toString());
      const r = await fetch(url, {
        method: opts.method || 'GET',
        body: opts.body,
        headers: {
          ...authH(opts.withToken !== false),
          ...(opts.headers || {})
        },
        mode: 'cors',
        signal: opts.signal // [SEARCH] for aborting
      });
      log('<-', r.status, url.toString());
      if (!r.ok) {
        const txt = await r.text().catch(() => '');
        throw new Error(`HTTP ${r.status} ${txt.slice(0,100)}`);
      }
      return r.headers.get('content-type')?.includes('json') ? await r.json() : await r.text();
    }

    const sLog = (...a) => log('[SEARCH]', ...a); // [FIX] was missing
    const SEARCH = {
      abort: null,
      lastQ: '',
      debounce: 0,
      scopeId: '',
      scopeName: '~',
      pending: false
    };

    function updateSearchPlaceholder() {
      const el = document.getElementById('search');
      if (el) el.placeholder = `Search '${SEARCH.scopeName}'...`;
    }
    updateSearchPlaceholder();

    async function searchLocal(q) {
      q = q.toLowerCase().trim();
      if (!q) return [];
      const out = [],
        seen = new Set();
      for (const it of RAM_ITEMS.values()) {
        if (SEARCH.scopeId && it.ParentId !== SEARCH.scopeId) continue;
        const name = it.name;
        if (name.toLowerCase().includes(q) && !seen.has(it.id)) {
          seen.add(it.id);
          out.push({
            Id: it.id,
            Name: name,
            Type: it.type,
            ProductionYear: it.ProductionYear,
            ParentId: it.ParentId,
            _src: 'cache'
          });
          if (out.length > 200) break;
        }
      }
      const idbHits = await IDB.searchByName(q, 200, SEARCH.scopeId);
      for (const it of idbHits)
        if (!seen.has(it.Id)) {
          seen.add(it.Id);
          out.push({
            ...it,
            _src: 'cache'
          });
        }
      sLog('Local hits:', out.length);
      return out;
    }

    let SEARCH_DEBOUNCE_T = 0;

    async function doSearch(q) {
      q = q.trim();

      // [FIX 1] Clear timer + abort if user is still typing
      clearTimeout(SEARCH_DEBOUNCE_T);

      // [FIX 2] Gate: Jellyfin is useless < 3 chars. And don't re-search same query
      if (!STATE.userId || q.length < 3 || q === SEARCH.lastQ) {
        if (q.length < 3) {
          // abort any in-flight search when we go back to <3
          SEARCH.abort?.abort();
          renderList([], {
            mode: 'cache',
            loading: false
          });
          setStatus(q.length ? `Type ${3-q.length} more letters...` : '');
        }
        SEARCH.lastQ = q; // remember so we don't re-fire
        return;
      }

      // [FIX 3] Wait 450ms after last keystroke before firing
      SEARCH_DEBOUNCE_T = setTimeout(() => doSearch.flush(q), 450);
    }

    doSearch.flush = async (q) => {
      if (!q) return;
      SEARCH.lastQ = q;
      SEARCH.abort?.abort(); // [OPT] cancel previous
      SEARCH.abort = new AbortController();
      SEARCH.pending = true;

      const t0 = performance.now();

      // [STEP 1] INSTANT: Fuzzy search IDB. Uses index so it's fast
      const cacheHits = await IDB.searchByName(q, 100, SEARCH.scopeId);
      const sortedCache = clientSort(cacheHits, q); // re-score with server bias
      renderList(sortedCache, {
        mode: 'cache',
        loading: true
      });
      setStatus(sortedCache.length ? `${sortedCache.length} cached` : `Searching '${SEARCH.scopeName}'...`);

      // [STEP 2] FAST SERVER: Only fetch what we need
      const urlParams = {
        SearchTerm: q,
        IncludeItemTypes: 'Movie,Series,Audio,Book,Folder',
        Recursive: true,
        Limit: 50, // [OPT] was 100. We merge with cache
        Fields: 'SortName,ProductionYear,ParentId,Type', // [OPT] was 3. Minimal
        EnableImages: 'false',
        EnableUserData: 'false',
        UserId: STATE.userId
        // [OPT] No SortBy. We sort client
      };
      if (SEARCH.scopeId) urlParams.ParentId = SEARCH.scopeId;

      try {
        const data = await jf(`/Users/${STATE.userId}/Items`, {
          signal: SEARCH.abort.signal,
          params: urlParams
        });

        const serverHits = (data.Items || []).map(i => ({
          Id: i.Id,
          Name: safeDecode(i.Name || i.SortName || ''),
          Type: i.Type,
          ProductionYear: i.ProductionYear,
          ParentId: i.ParentId || '',
          _src: 'server'
        }));

        // [STEP 3] MERGE + CLIENT SORT
        const merged = clientSort(dedupeById([...serverHits, ...cacheHits]), q);

        renderList(merged, {
          mode: 'server',
          loading: false
        });
        setStatus(`${serverHits.length} new. ${merged.length} total in ${(performance.now()-t0).toFixed(0)}ms`);

        // [STEP 4] SIDE-LOAD to cache for next fuzzy search
        if (serverHits.length) {
          const byParent = groupBy(serverHits, 'ParentId');
          for (const [parentId, kids] of byParent) {
            const existing = await IDB.get(parentId);
            const mergedFolder = existing ? dedupeById([...existing.items, ...kids]) : kids;
            await IDB.put(parentId, mergedFolder, {
              complete: false,
              total: mergedFolder.length
            });
          }
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          log('SEARCH FAIL', e);
          renderList(sortedCache, {
            mode: 'cache',
            loading: false
          });
          setStatus('Offline results only');
        }
      } finally {
        SEARCH.pending = false;
      }
    };

    // [NEW HELPER] Client sort. Runs on <200 items so it's free
    // [SHARED] Client sort. Works for search items {Name} and folder items {name}
    function clientSort(items, q = '') {
      q = (q || '').toLowerCase();
      return items.map(it => {
        const name = (it.Name || it.name || '').toLowerCase(); // [FIX] handle both
        let score = it._score || 0;
        if (q) {
          if (name === q) score += 100; // exact
          else if (name.startsWith(q)) score += 50; // starts with
          else if (name.includes(q)) score += 10; // contains
        }
        const type = it.Type || it.type;
        const isFolder = ['Folder', 'CollectionFolder', 'BoxSet', 'Series', 'Season', 'MusicAlbum'].includes(type);
        return {
          ...it,
          _score: score,
          _isFolder: isFolder
        };
      }).sort((a, b) => {
        if (b._score !== a._score) return b._score - a._score;
        // 2. folders first
        if (a._isFolder && !b._isFolder) return -1;
        if (!a._isFolder && b._isFolder) return 1;
        // 3. name
        const aName = a.Name || a.name || '';
        const bName = b.Name || b.name || '';
        return aName.localeCompare(bName, undefined, {
          numeric: true,
          sensitivity: 'base'
        });
      });
    }

    function safeDecode(s) {
      try {
        return decodeURIComponent(s);
      } catch {
        return s;
      }
    }

    function renderList(items, {
      mode = 'server',
      loading = false
    } = {}) {
      const wrap = $('listContent');
      if (!items.length && loading) {
        return wrap.innerHTML = `<div class="center"><span class="spinner"></span> Searching...</div>`;
      }
      if (!items.length && !loading) {
        return wrap.innerHTML = `<div class="center">No results for "${SEARCH.last}" in '${SEARCH.scopeName}'</div>`;
      }

      wrap.innerHTML = `
    <div class="row head"><div></div><div>Name</div><div>Year</div></div>
    ${items.map(it => `
      <div class="row" data-id="${it.Id}">
        <div>${icon(it.Type)} ${it._src==='cache'&&mode==='cache'?'':''}</div>
        <div class="name">${it.Name}</div> <!-- [FIX] escape HTML after decode -->
        <div class="meta-right">${it.ProductionYear||''}</div>
      </div>
    `).join('')}
  `;
      wrap.querySelectorAll('.name').forEach(el => {
        el.onclick = () => openFolder(el.closest('.row').dataset.id, el.textContent);
      });
    }

    function setSearchScope(id, name) {
      SEARCH.scopeId = id || '';
      SEARCH.scopeName = name || '~';
      updateSearchPlaceholder();
      if (SEARCH.lastQ) doSearch(SEARCH.lastQ);
    }

    document.addEventListener('input', e => {
      if (e.target.id !== 'search') return;
      clearTimeout(SEARCH.debounce);
      SEARCH.debounce = setTimeout(() => doSearch(e.target.value), 120);
    });
    document.addEventListener('keydown', e => {
      if (e.target.id !== 'search') return;

        e.target.value = '';

    // [TABS] Progress UI
    function createTab(id, name, total) {
      let wrap = $('dlTabs');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = 'dlTabs';
        wrap.className = 'dl-tabs hidden';
        $('headerBottom').after(wrap);
        const style = document.createElement('style');
        style.textContent = `.dl-tabs{display:flex;gap:6px;padding:6px 14px;border-top:1px solid var(--border);overflow-x:auto}.dl-tab{min-width:160px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px}.dl-tab.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl-tab.bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}.dl-tab.fill{height:100%;width:0%;background:var(--mint);transition:width.2s}`;
        document.head.appendChild(style);
      }
      wrap.classList.remove('hidden');
      const el = document.createElement('div');
      el.className = 'dl-tab';
      el.id = 'dl_' + id;
      el.innerHTML = `<div class="name">${sanitizeFilename(name)}</div><div class="bar"><div class="fill"></div></div><div class="pct">0%</div>`;
      wrap.appendChild(el);
      dlTabs.set(id, {
        el,
        received: 0,
        total
      });
    }

    function updateTab(id, received) {
      const t = dlTabs.get(id);
      if (!t) return;
      t.received = received;
      const pct = t.total ? Math.min(100, received / t.total * 100).toFixed(0) : '';
      t.el.querySelector('.fill').style.width = pct + '%';
      t.el.querySelector('.pct').textContent = `${(received/1e6).toFixed(1)}MB ${pct? pct+'%':''}`;
    }

    function closeTab(id) {
      dlTabs.get(id)?.el.remove();
      dlTabs.delete(id);
      if (dlTabs.size === 0) $('dlTabs')?.classList.add('hidden');
    }

    async function login() {
      $('loginMsg').textContent = '';
      $('loginBtn').disabled = true;
      STATE.server = $('server').value.trim().replace(/\/$/, '') || STATE.server;
      const u = $('user').value.trim(),
        p = $('pass').value;
      if (!u) return $('loginMsg').textContent = 'Username required';
      try {
        let data;
        try {
          data = await jf('/Users/AuthenticateByName', {
            method: 'POST',
            body: JSON.stringify({
              Username: u,
              Pw: p
            }),
            headers: {
              'Content-Type': 'application/json'
            },
            withToken: false
          });
        } catch (e) {
          if (String(e).includes('415')) {
            data = await jf('/Users/AuthenticateByName', {
              method: 'POST',
              body: new URLSearchParams({
                Username: u,
                Pw: p
              }),
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
              },
              withToken: false
            });
          } else throw e;
        }
        STATE.token = data.AccessToken;
        STATE.userId = data.User.Id;
        localStorage.setItem('jf_t', STATE.token);
        localStorage.setItem('jf_u', STATE.userId);
        localStorage.setItem('jf_s', STATE.server);
        $('login').classList.add('hidden');
        $('browser').classList.remove('hidden');
        $('logoutBtn').classList.remove('hidden');
        $('repoTitle').textContent = STATE.server.replace(/^https?:\/\//, '');
        await openFolder('', '~');
        setupPullRefresh();
      } catch (e) {
        log('LOGIN FAIL', e);
        $('loginMsg').className = 'err';
        $('loginMsg').textContent = e.message;
        $('loginBtn').disabled = false;
      }
    }

    async function logout() {
      localStorage.removeItem('jf_t'); // [FIX] only auth
      localStorage.removeItem('jf_u');
      STATE.token = '';
      STATE.userId = '';
      STATE.path = [];
      STATE.cache.clear();
      await IDB.clear(); // [IDB] wipe folders only
      exitSelectMode();
      dirHandle = null;
      dlTabs.forEach((_, k) => closeTab(k));
      $('browser').classList.add('hidden');
      $('login').classList.remove('hidden');
      $('logoutBtn').classList.add('hidden');

    }

    const dedupeById = (arr) => {
      const byId = new Map();
      for (const i of arr) {
        const id = i.Id ?? i.id;
        if (!id) continue;
        const cur = byId.get(id);
        if (!cur || i._src === 'server') byId.set(id, {
          ...i,
          Id: id,
          id
        }); // normalize
      }
      return [...byId.values()];
    };

    const groupBy = (arr, key) => {
      const m = new Map();
      for (const i of arr) {
        const k = i[key] ?? '';
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(i);
      }
      return m;
    };

    async function cachePut(id, items, meta = {
      complete: true,
      total: items.length
    }) {
      const clean = items;
      STATE.cache.set(id, clean); // RAM still just items[]
      touch(id);
      await IDB.put(id, clean, meta);

      const childIds = clean.filter(i => i.isFolder).map(i => i.id);
      await IDB.setChildren(id, childIds);

      if (STATE.cache.size > CFG.CACHE_MAX) {
        const oldest = LRU.keys().next().value;
        if (oldest) {
          STATE.cache.delete(oldest);
          LRU.delete(oldest);
          await IDB.del(oldest);
          await IDB.delTree(oldest);
        }
      }
    }

    async function openFolder(id, name, pushPath = true) {
      log('OPEN', name || '~', id);
      setSearchScope(id, name);
      exitSelectMode();

      if (pushPath && id !== '') {
        if (STATE.path.at(-1)?.id !== id) STATE.path.push({
          id,
          name
        });
      }
      renderBC();

      // 1. Read v4 blob from IDB first
      const blob = await IDB.get(id); // {items, meta, ts} | null
      let renderedFromCache = false;

      if (blob) {
        // [CACHE HIT] Render immediately from cache
        const sorted = clientSort(blob.items);
        STATE.cache.set(id, sorted);
        renderFolder(id, sorted, {
          ...blob.meta,
          loading: true
        }); // [loading=true] because we will refresh
        renderedFromCache = true;
        setStatus(`Cached ${blob.items.length}+. Updating...`);
      } else {
        // [CACHE MISS] Show full spinner
        $('listContent').innerHTML = '<div class="center"><div class="spinner"></div>Loading...</div>';
        setStatus('Loading...');
      }

      // 2. Always fetch from server to refresh. Abort previous
      if (STATE.loadingCtrl) STATE.loadingCtrl.abort();
      const ctrl = new AbortController();
      STATE.loadingCtrl = ctrl;

      try {
        // [FIX] Minimal fields. No server sort. Small limit
        const params = new URLSearchParams({
          ParentId: id || '',
          Recursive: 'false',
          IncludeItemTypes: 'Folder,CollectionFolder,BoxSet,Movie,Series,Season,Episode,MusicAlbum,Audio,Book,Photo',
          Fields: 'SortName,Type,ProductionYear', // [CUT] Was 9 fields. Now 3. This is the big win
          Limit: 500, // [FIX] Use your CFG.LIMIT but don't ask server to sort it
          EnableImages: 'false',
          EnableUserData: 'false', // [CUT] Don't need watched/progress for folder list
          UserId: STATE.userId
        });

        const data = await jf(`/Users/${STATE.userId}/Items?${params}`, {
          signal: ctrl.signal
        });

        const freshItems = (data.Items || []).map(i => ({
          id: i.Id,
          name: safeDecode(i.Name || i.SortName || ''),
          type: i.Type,
          isFolder: ['Folder', 'CollectionFolder', 'BoxSet', 'Series', 'Season', 'MusicAlbum'].includes(i.Type),
          ProductionYear: i.ProductionYear || '',
          ParentId: id || ''
          // [CUT] size, path, mediaSources, mediaType - not used in list view
        }));

        // [FIX] Sort on client instead of server
        const sorted = clientSort(freshItems);
        const meta = {
          complete: true,
          total: data.TotalRecordCount
        };

        // 3. Write v4 blob to IDB + RAM, then render final
        await cachePut(id, sorted, meta);
        STATE.cache.set(id, sorted);
        await renderFolder(id, sorted, {
          ...meta,
          loading: false
        }); // [loading=false] done

        IDB.countItems(c => setStatus(`Cached ${c} items`));

      } catch (e) {
        if (e.name !== 'AbortError') {
          log('LOAD FAIL', e);
          // [FIX] If we rendered from cache, don't nuke it. Just stop spinner
          if (renderedFromCache) {
            const sorted = clientSort(blob.items);
            renderFolder(id, sorted, {
              ...blob.meta,
              loading: false
            });
            setStatus('Update failed. Showing cached.');
          } else {
            $('listContent').innerHTML = `<div class="center err">${escape(e.message)}</div>`;
            setStatus('Error');
          }
        }
      } finally {
        STATE.loadingCtrl = null;
      }
    }

    async function goBack(idx) {
      log('BACK', idx);
      if (STATE.loadingCtrl) STATE.loadingCtrl.abort();
      exitSelectMode();
      STATE.path = STATE.path.slice(0, idx + 1);
      const id = idx < 0 ? '' : STATE.path.at(-1).id;
      const name = idx < 0 ? '~' : STATE.path.at(-1).name;
      renderBC();
      await openFolder(id, name, true);
    }

    function getDownloadInfo(item) {
      const id = item.id;
      const api = `api_key=${STATE.token}`;
      const name = item.name || 'download';
      let url = '',
        ext = 'mp4';
      const guessVideoExt = () => {
        const src = item.mediaSources && item.mediaSources[0];
        if (src && src.Container) {
          const c = String(src.Container).toLowerCase().split(',')[0].trim();
          if (c) return c;
        }
        const p = (item.path || '').toLowerCase();
        const m = p.match(/\.(mp4|mkv|webm|avi|mov|m4v|wmv|ts|m2ts|mpg|mpeg)$/);
        return m ? m[1] : 'mp4';
      };
      if (item.mediaType === 'Video' || ['Movie', 'Episode', 'Video'].includes(item.type)) {
        url = `${STATE.server}/Items/${id}/Download?${api}`;
        ext = guessVideoExt();
      } else if (item.mediaType === 'Audio' || ['Audio', 'AudioBook'].includes(item.type)) {
        url = `${STATE.server}/Items/${id}/Download?${api}`;
        const p = (item.path || '').toLowerCase();
        const m = p.match(/\.(mp3|m4a|flac|ogg|opus|wav|m4b|aac)$/);
        ext = m ? m[1] : 'mp3';
      } else {
        url = `${STATE.server}/Items/${id}/Download?${api}`;
        const p = (item.path || '').toLowerCase();
        const m = p.match(/\.(pdf|epub|cbz|cbr|webp|jpe?g|png|gif|txt)$/);
        ext = m ? m[1].replace('jpeg', 'jpg') : 'bin';
      }
      return {
        url,
        ext,
        filename: `${sanitizeFilename(name)}.${ext}`
      };
    }

    // [FSA] 0-RAM streaming
    async function getDirHandle() {
      if (dirHandle) return dirHandle;
      if (!('showDirectoryPicker' in window)) throw new Error('Use Chrome/Edge Android 86+');
      dirHandle = await showDirectoryPicker({
        mode: 'readwrite'
      });
      const perm = await dirHandle.requestPermission({
        mode: 'readwrite'
      });
      if (perm !== 'granted') throw new Error('Folder access denied');
      return dirHandle;
    }

    async function streamToDisk(url, fileHandle, label, tabId) {
      const r = await fetch(url, {
        headers: authH(true),
        cache: 'no-store'
      });
      if (!r.ok || !r.body) throw new Error(`HTTP ${r.status} ${label}`);
      const total = +r.headers.get('Content-Length') || 0;
      createTab(tabId, label, total);

      const writable = await fileHandle.createWritable();

      // [FAST] Pipe with progress. No JS loop.
      let received = 0;
      let last = 0;
      const progressStream = new TransformStream({
        transform(chunk, controller) {
          received += chunk.length;
          const now = performance.now();
          if (now - last > 500) { // 2x per sec max
            updateTab(tabId, received);
            last = now;
          }
          controller.enqueue(chunk);
        }
      });

      try {
        await r.body.pipeThrough(progressStream).pipeTo(writable);
      } catch (e) {
        await writable.abort();
        throw e;
      }
      closeTab(tabId);
    }

    async function batchDownload() {
      const items = sel.vals().map(id => findItemById(id)).filter(it => it && !it.isFolder);
      if (!items.length) return exitSelectMode();

      const dir = await getDirHandle(); // 1 prompt, permission sticks
      let ok = 0,
        fail = 0;

      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        const tabId = `${it.id}_${Date.now()}_${i}`; // [UNIQUE] so tabs don't collide
        try {
          const {
            url,
            filename
          } = await getDownloadInfo(it); // still need this for.mkv vs.bin
          setStatus(`[${i+1}/${items.length}] ${filename}`);
          const fileHandle = await dir.getFileHandle(filename, {
            create: true,
            exclusive: false
          }); // [KEY] overwrite if exists
          await streamToDisk(url, fileHandle, filename, tabId);
          ok++;
        } catch (e) {
          log('DL FAIL', it.name, e);
          closeTab(tabId);
          fail++;
          setStatus(`Failed: ${it.name}`);
        }
      }
      setStatus(`Done: ${ok} ok, ${fail} fail`);
      exitSelectMode();
    }

    // [HELPER] you need this if you removed it
    function findItemById(id) {
      for (const arr of STATE.cache.values()) {
        const found = arr.find(x => x.id === id);
        if (found) return found;
      }
      return null;
    }
    async function downloadOne(item) {
      const dir = await getDirHandle();
      const {
        url,
        filename
      } = getDownloadInfo(item);
      setStatus(`Starting: ${filename}`);
      const fileHandle = await dir.getFileHandle(filename, {
        create: true
      });
      await streamToDisk(url, fileHandle, filename, item.id);
      setStatus(`Saved: ${filename}`);
    }

    // [SEL] Multi-select logic
    function enterSelectMode(firstItem) {
      STATE.selectMode = true;
      sel.clear();
      toggleSelect(firstItem);
      renderSelectBar();
    }

    function exitSelectMode() {
      STATE.selectMode = false;
      sel.clear();
      document.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
      $('headerBottom').innerHTML = `<input id="search" placeholder="Search..." style="width:100%;margin-right:8px"><div id="status" class="meta">Idle</div>`; // put #status back
    }

    function toggleSelect(item) {
      if (sel.has(item.id)) {
        sel.del(item.id);
        document.querySelector(`.row[data-id="${item.id}"]`)?.classList.remove('selected');
      } else {
        sel.add(item.id);
        document.querySelector(`.row[data-id="${item.id}"]`)?.classList.add('selected');
      }
      if (sel.size() === 0) exitSelectMode();
      else renderSelectBar();
    }

    function renderSelectBar() {
      $('headerBottom').innerHTML = `
  <div class="select-bar">
    <span id="status" class="count">${sel.size()} selected</span>
    <div class="spacer"></div>
    <button class="ghost" id="cancelSel">Cancel</button>
    <button class="primary" id="dlSel">Download</button>
  </div>`;
      $('cancelSel').onclick = exitSelectMode;
      $('dlSel').onclick = batchDownload;
    }

    function renderNormalHeader() {
      $('headerBottom').innerHTML = `<input id="search" placeholder="Search..." style="width:100%;margin-right:8px"><div id="status" class="meta">Idle</div>`;
    }

    function renderBC() {
      const parts = [`<a onclick="goBack(-1)">~</a>`];
      STATE.path.forEach((p, i) => parts.push(`<span class="sep">/</span> <a onclick="goBack(${i})">${p.name}</a>`));
      $('bc').innerHTML = parts.join('');
      $('repoTitle').textContent = STATE.server.replace(/^https?:\/\//, '') + (STATE.path.length ? '/' + STATE.path.map(p => p.name).join('/') : '');
    }

    function renderFolder(id, items, meta = {
      complete: true,
      loading: false
    }) {
      if (!items.length) {
        $('listContent').innerHTML = '<div class="center meta">Empty</div>';
        return;
      }
      const suffix = meta.complete ? '' : '+';
      const head = `<div class="row head"><div></div><div>Name</div><div>Size ${suffix}</div></div>`;

      const rows = items.map(it => {
        const itemJson = JSON.stringify(it).replace(/"/g, '&quot;');
        const metaTxt = it.isFolder ? 'Folder' : fmtBytes(it.size);
        return `<div class="row" data-id="${it.id}" data-touched="0" ontouchstart="this.dataset.touched=0; this._t=setTimeout(()=>{this.dataset.touched=1; onRowLong(${itemJson});},${CFG.LONG_PRESS_MS})" ontouchmove="clearTimeout(this._t)" ontouchend="clearTimeout(this._t)" onclick="if(this.dataset.touched==='1'){this.dataset.touched='0'; return;} onRowTap(${itemJson})"> <div>${icon(it.type)}</div><div class="name">${it.name}</div><div class="meta-right">${metaTxt}</div> </div>`;
      }).join('');

      const loader = (!meta.complete && meta.loading) ?
        `<div class="row loading-more"><div></div><div class="name center meta">Loading more...</div><div><span class="spinner sm"></span></div></div>` :
        '';

      $('listContent').innerHTML = head + rows + loader;
    }

    function onRowTap(item) {
      if (item.isFolder) return openFolder(item.id, item.name, true);
      if (STATE.selectMode) return toggleSelect(item);
      downloadOne(item).then(() => setStatus(`Saved: ${item.name}`)).catch(e => {
        log('DL FAIL', e);
        setStatus('Download failed')
      });
    }

    function onRowLong(item) {
      if (item.isFolder) return;
      if (!STATE.selectMode) enterSelectMode(item);
      else toggleSelect(item);
    }

    function setupPullRefresh() {
      const list = $('list');
      const ptr = $('ptr');
      const ptrTxt = $('ptrTxt');
      const ptrSpin = $('ptrSpin');
      list.addEventListener('touchstart', e => {
        if (list.scrollTop === 0 && !STATE.selectMode) {
          STATE.ptr.startY = e.touches[0].clientY;
          STATE.ptr.pulling = true;
        }
      }, {
        passive: true
      });
      list.addEventListener('touchmove', e => {
        if (!STATE.ptr.pulling) return;
        const dy = e.touches[0].clientY - STATE.ptr.startY;
        if (dy > 0) {
          e.preventDefault();
          const pull = Math.min(dy, CFG.PULL_THRESHOLD * 1.5);
          ptr.style.transform = `translateY(${pull}px)`;
          if (pull > CFG.PULL_THRESHOLD) {
            ptr.classList.add('active');
            ptrTxt.textContent = 'Release to refresh';
          } else {
            ptr.classList.remove('active');
            ptrTxt.textContent = 'Pull to refresh';
          }
        }
      }, {
        passive: false
      });
      list.addEventListener('touchend', async () => {
        if (!STATE.ptr.pulling) return;
        const dy = parseInt(ptr.style.transform.replace(/[^0-9]/g, '')) || 0;
        ptr.style.transform = '';
        STATE.ptr.pulling = false;
        if (dy > CFG.PULL_THRESHOLD) {
          ptrSpin.classList.remove('hidden');
          ptrTxt.textContent = 'Refreshing...';
          const id = STATE.path.length ? STATE.path.at(-1).id : '';
          const name = STATE.path.length ? STATE.path.at(-1).name : '~';

          // [TREE NUKE] delete this folder + all children from IDB + RAM
          await IDB.delTree(id);
          for (const k of STATE.cache.keys()) {
            if (k === id || (await IDB.get(k)) === null) STATE.cache.delete(k); // cheap: just clear all RAM
          }
          STATE.cache.clear(); // [SIMPLE] easiest: clear RAM, let IDB handle disk

          await openFolder(id, name, false);
          ptrSpin.classList.add('hidden');
          ptrTxt.textContent = 'Pull to refresh';
          ptr.classList.remove('active');
        }
      });
    }

    $('loginBtn').onclick = login;
    $('logoutBtn').onclick = logout;
    ['server', 'user', 'pass'].forEach(id => $(id).addEventListener('keydown', e => e.key === 'Enter' && login()));

    window.onload = async () => { // [FIX] async for IDB
      $('server').value = STATE.server;
      if (STATE.token && STATE.userId) {
        $('login').classList.add('hidden');
        $('browser').classList.remove('hidden');
        $('logoutBtn').classList.remove('hidden');
        $('repoTitle').textContent = STATE.server.replace(/^https?:\/\//, '');

        const root = await IDB.get('');
        if (root) STATE.cache.set('', root);

        await openFolder('', '~').then(setupPullRefresh); // [FIX] '' not undefined
      }
    };

    // [FIX] Set wrapper so it can never become an Array
    const sel = {
      add: id => STATE.selected.add(id),
      del: id => STATE.selected.delete(id),
      has: id => STATE.selected.has(id),
      size: () => STATE.selected.size,
      vals: () => Array.from(STATE.selected.values()),
      clear: () => STATE.selected.clear()
    };

    (() => {
      const ENTRY = 'Jades World Searcher v2',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>

</html>

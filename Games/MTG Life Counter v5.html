<!DOCTYPE html>
<!-- By Ion_o_koji -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>MTG Life Counter v5</title>
  <style>
    :root {
      --player1-color: #0033cc;
      --player2-color: #cc0000;

      dark-mode {
        background-color: #111;
        color: white;
      }

      .dark-mode .player1,
      .dark-mode .player2 {
        background-color: #111;
      }

      #dark-mode-toggle {
        position: absolute;
        top: 48%;
        right: -90px;
        transform: translateY(-50%);
        font-size: 30px;
        padding: 25px 20px;
        border: none;
        border-radius: 10px 0 0 10px;
        background-color: #222;
        color: white;
        cursor: pointer;
        transform: rotate(90deg);
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }

    .player {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    .player1 {
      background-color: var(--player1-color);
      color: white;
    }

    .player2 {
      background-color: var(--player2-color);
      color: white;
      transform: rotate(180deg);
    }

    .name {
      font-size: 40px;
      margin-bottom: 20px;
      user-select: none;
    }

    .life {
      font-size: 300px;
      margin: 20px 0;
      user-select: none;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      flex-wrap: wrap;
    }

    .minus,
    .plus {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .reset {
      margin-top: 20px;
    }

    button {
      font-size: 60px;
      padding: 30px 60px;
      border: none;
      border-radius: 12px;
      background-color: #222;
      color: white;
      cursor: pointer;
      min-width: 280px;
      user-select: none;
      touch-action: manipulation;
    }

    button:hover {
      background-color: #444;
    }

    button:active {
      background-color: #666;
    }

  </style>
</head>

<body>
  <!-- Player 2 -->
  <div class="player player2">
    <div class="name" id="name2" onclick="setName('name2')">Player 2</div>
    <div class="life" id="life2">40</div>
    <div class="controls">
      <div class="minus">
        <button onclick="change('life2', -1)">−1</button>
        <button onclick="change('life2', -5)">−5</button>
      </div>
      <div class="plus">
        <button onclick="change('life2', 1)">+1</button>
        <button onclick="change('life2', 5)">+5</button>
      </div>
    </div>
    <div class="reset">
      <button onclick="reset('life2')">Reset</button>
    </div>
  </div>
  <!-- Player 1 -->
  <div class="player player1">
    <div class="name" id="name1" onclick="setName('name1')">Player 1</div>
    <div class="life" id="life1">40</div>
    <div class="controls">
      <div class="minus">
        <button onclick="change('life1', -1)">−1</button>
        <button onclick="change('life1', -5)">−5</button>
      </div>
      <div class="plus">
        <button onclick="change('life1', 1)">+1</button>
        <button onclick="change('life1', 5)">+5</button>
      </div>
    </div>
    <div class="reset">
      <button onclick="reset('life1')">Reset</button>
    </div>
  </div>
  <div>
    <button id="dark-mode-toggle" onclick="toggleDarkMode()">Dark Mode</button>
  </div>
  <script>
    function change(id, delta) {
      const el = document.getElementById(id);
      let value = parseInt(el.textContent, 10) + delta;
      if (value < 0) value = 0;
      el.textContent = value;
    }

    function reset(id) {
      document.getElementById(id).textContent = 40;
    }

    function setName(id) {
      const name = prompt('Enter player name:');
      if (name) {
        document.getElementById(id).textContent = name;
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    (() => {
      const ENTRY = 'MTG Life Counter v5',
        KEY = 'Ion-o-koji Watermark';
      const logs = (localStorage.getItem(KEY) || "").split('\n').map(line => line.replace(/^- /, '').trim()).filter(line => line && line !== ENTRY);
      logs.push(ENTRY);
      localStorage.setItem(KEY, logs.map(item => `- ${item}`).join('\n'));
    })();

  </script>
</body>

</html>

		<html>

		<head>
			<script src="//www.google.com/jsapi"></script>

				window.parent.maeExportApis_();

			<style>
				body,
      html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }
      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }
      #loading-progress {
        font-size: 18px;
        margin-top: 20px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: inline-block;
      }

				#startButton {
					display: block;
					width: 160px;
					height: 40px;
					background-color: #4CAF50;
					color: white;
					text-align: center;
					text-decoration: none;
					font-size: 16px;
					margin: 20px auto;
					padding: 10px 20px;
					border: none;
					border-radius: 8px;
					cursor: pointer;
					font-family: 'Press Start 2P', cursive;
					box-shadow: 0px 0px 10px 2px #000000;
				}
			</style>
			<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
			<style type="text/css">
				#button {
					display: none;
				}

				.imgb_vis {
					animation: imgb-animation 7s linear;
				}

				@keyframes imgb-animation {
					10% {
						transform: translateX(0);
					}

					20% {
						transform: translateX(100px);
					}

					90% {
						transform: translateX(100px);
					}

					100% {
						transform: translateX(0);
					}
				}
			</style>
		</head>

		<body>
			<div class="html">
				<div id="game" style="display: none;"></div>
				<button id="startButton">PLAY</button>
			</div>
			<script>
				document.getElementById("game").style.display = "none";
            function startGame() {
                document.getElementById("game").style.display = "block";
                document.getElementById("startButton").style.display = "none";
                EJS_player = "#game";
				EJS_core = "gba";
                EJS_color = "#00000";
                EJS_startOnLoaded = true;
                EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
				EJS_gameUrl = "https://cdn.jsdelivr.net/gh/Stinkalistic/UGS@main/ROMs/pokemonmodernemerald.zip";
                loadGame();
            }
            document.getElementById("startButton").addEventListener("click", startGame);
            function loadGame() {
                var script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
                document.body.appendChild(script);
            }
			</script>
		</body>
		<html>
		<script type="text/javascript"></script>
	</body>
